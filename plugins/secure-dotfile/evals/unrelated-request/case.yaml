# A request about the shell config that has nothing to do with secrets does not start the skill.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Add an alias ll for 'ls -la' to my ~/.zshrc.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'secure-dotfile'
    min: 0
    max: 0
    arm: both
