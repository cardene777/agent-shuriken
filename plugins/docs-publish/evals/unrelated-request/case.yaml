# A small edit to the README that is not about writing documentation does not start the skill.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Fix the typo "recieve" in README.md.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'docs-publish'
    min: 0
    max: 0
    arm: both
