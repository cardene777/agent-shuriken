# A short question about git must not start the skill.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    How do I rename a local git branch? Answer in one sentence.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'repo-progress'
    min: 0
    max: 0
    arm: both
  - name: no-scan
    type: tool_used
    tool: Bash
    input_match: 'repo_progress\.py'
    min: 0
    max: 0
    arm: both
