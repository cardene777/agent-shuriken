# A new request that happens to say "fix" is ordinary work: the skill does not start and nothing is
# recorded.
schema_version: "1.1"
name: new-request
plugins: ["../.."]
execution:
  prompt: |
    Fix the login bug: src/login.py rejects passwords that contain a space, but spaces are allowed.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'feedback-loop'
    min: 0
    max: 0
    arm: both
  - name: nothing-opened
    type: tool_used
    tool: Bash
    input_match: 'feedback_loop\.py\\?"?\s+open'
    min: 0
    max: 0
    arm: both
  - name: login-fixed
    type: regex
    target: {source: file, path: src/login.py}
    pattern: '" " in password'
    match: not_contains
