# The diagram's .excalidraw file was edited by the user after the plugin wrote it, so a rebuild stops
# with exit 3. The agent leaves the edited file as it is, does not pass --replace, and asks the user
# whether to replace it (or writes under another name and says so).
schema_version: "1.1"
name: keeps-edited-file
plugins: ["../.."]
execution:
  prompt: |
    Add a Redis cache between the API and the database in the diagram docs/images/pipeline.diagram.json, then build the diagram again.
  max_turns: 20
  timeout_seconds: 500
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'excalidraw-diagram'
  - name: no-replace
    type: tool_used
    tool: Bash
    input_match: '--replace'
    min: 0
    max: 0
    arm: both
  - name: edit-kept
    type: regex
    target: {source: file, path: docs/images/pipeline.excalidraw}
    pattern: 'Ingest \(edited by hand\)'
  - name: refusal-seen
    type: regex
    target: trace
    pattern: 'not written by this plugin, or have changed'
    arm: with-only
  - name: asked-before-replacing
    type: llm
    criteria: |
      PASS if the reply tells the user that docs/images/pipeline.excalidraw changed after it was written (for example, edited in Excalidraw) and was not replaced, and either asks whether to replace it or says the new diagram was written under another name.
      Updating the spec file docs/images/pipeline.diagram.json is not a failure, and neither is writing the new diagram under another name.
      FAIL if the reply says the edited file was replaced or overwritten, or it does not mention that the existing diagram file was edited or kept.
