# Explaining what a Mermaid file shows draws nothing, so it does not start the skill.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    In two sentences, what does the flow in docs/flow.mmd describe? Just tell me; do not change any files.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'excalidraw-diagram'
    min: 0
    max: 0
    arm: both
  - name: nothing-built
    type: tool_used
    tool: Bash
    input_match: 'excalidraw_diagram\.py'
    min: 0
    max: 0
    arm: both
  - name: explained
    type: llm
    criteria: |
      PASS if the reply explains the flow: a cart goes to payment, a paid order goes to shipping, and a declined payment goes back to the cart. Other words for the same steps are not a failure.
      FAIL if the reply does not describe the flow, or says it drew or wrote a diagram or a file.
