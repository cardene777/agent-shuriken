# The tables in a schema file become table nodes that list their columns.
schema_version: "1.1"
name: er-diagram
plugins: ["../.."]
execution:
  prompt: |
    Draw an entity-relationship diagram of db/schema.sql as an Excalidraw file. Put the files in docs/images and call it schema.
  max_turns: 20
  timeout_seconds: 500
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'excalidraw-diagram'
  - name: three-tables
    type: regex
    target: {source: file, path: docs/images/schema.diagram.json}
    pattern: '"shape": *"table"[\s\S]*"shape": *"table"[\s\S]*"shape": *"table"'
  - name: columns-listed
    type: regex
    target: {source: file, path: docs/images/schema.excalidraw}
    pattern: '(?=[\s\S]*"type": *"excalidraw")(?=[\s\S]*user_id)(?=[\s\S]*order_id)(?=[\s\S]*quantity)'
