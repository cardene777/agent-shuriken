# Renaming a function is a code change with no explainer to write, so it does not start the skill.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Rename the function retryJob in src/queue.js to retryLater, and update every place that calls it.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'dragon-explainer'
    min: 0
    max: 0
    arm: both
