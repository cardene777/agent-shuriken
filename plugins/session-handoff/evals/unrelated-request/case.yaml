# Asked for a summary to continue tomorrow without calling the skill by name, the agent does not start
# the skill and saves nothing.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    I'm stopping for today. Write me a short summary of where this project stands so I can pick it up tomorrow.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'session-handoff'
    min: 0
    max: 0
    arm: both
  - name: nothing-saved
    type: tool_used
    tool: Bash
    input_match: 'session_handoff'
    min: 0
    max: 0
    arm: both
