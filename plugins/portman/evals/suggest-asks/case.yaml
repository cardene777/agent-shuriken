# Asked for a port for a new API server, the agent suggests free ports and asks which one to use: it
# does not register a port before the user picks one.
schema_version: "1.1"
name: suggest-asks
plugins: ["../.."]
execution:
  prompt: |
    I'm adding an API server to this shop project, and it needs a port of its own that won't clash with my other projects' dev servers. Which port should it use?
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'portman'
    arm: with-only
  - name: suggested
    type: tool_used
    tool: Bash
    input_match: 'portman\.py\\?"?(?:\s|\\n)+suggest'
    arm: with-only
  - name: not-registered
    type: tool_used
    tool: Bash
    input_match: 'portman\.py\\?"?(?:\s|\\n)+add'
    min: 0
    max: 0
    arm: both
  - name: asks-which
    type: llm
    criteria: |
      PASS if the reply offers one or more specific port numbers for the API server and asks the user which one to use, or whether to use the recommended one, before registering it.
      FAIL if the reply says a port was already registered or written into the project, or offers no port number.
