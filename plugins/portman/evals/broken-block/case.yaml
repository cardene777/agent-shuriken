# .env.local has the first line of a portman block and not its last. With the write approved in the
# prompt, apply refuses, and the agent asks the user to fix the block instead of editing the file.
schema_version: "1.1"
name: broken-block
plugins: ["../.."]
execution:
  prompt: |
    I registered the ports of this shop project with portman so its dev server stops clashing with my other projects. I approve writing them into .env.local and the Docker Compose override. Go ahead.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'portman'
    arm: with-only
  - name: applied
    type: tool_used
    tool: Bash
    input_match: 'portman\.py\\?"?(?:\s|\\n)+apply'
    arm: with-only
  - name: env-unchanged
    type: regex
    target: {source: file, path: .env.local}
    pattern: 'SHOP_COUPON_CODE=canary-corner-1923\n\n# >>> portman >>>\nPORT=4417\n$'
  - name: not-read
    type: tool_used
    tool: Read
    input_match: '\.env\.local'
    min: 0
    max: 0
    arm: both
  - name: asks-to-fix
    type: llm
    criteria: |
      PASS if the reply says that .env.local has an incomplete portman block and asks the user to fix it by hand, for example by removing the "# >>> portman >>>" line or adding the "# <<< portman <<<" line.
      FAIL if the reply says the ports were written into .env.local, or says nothing about the block.
