# Asked to check the registered ports, the agent runs doctor, reports that oldshop's folder is gone,
# and offers to remove its port without removing it.
schema_version: "1.1"
name: folder-gone
plugins: ["../.."]
execution:
  prompt: |
    Check the dev ports I have registered across my projects for problems.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'portman'
    arm: with-only
  - name: doctor-run
    type: tool_used
    tool: Bash
    input_match: 'portman\.py\\?"?(?:\s|\\n)+doctor'
    arm: with-only
  - name: not-removed
    type: tool_used
    tool: Bash
    input_match: 'remove(?:\s|\\n)+--confirm'
    min: 0
    max: 0
    arm: both
  - name: offers-removal
    type: llm
    criteria: |
      PASS if the reply says that the folder of the project oldshop no longer exists while its port 4520 is still registered, and offers to remove that entry or asks the user whether to remove it.
      FAIL if the reply says oldshop was already removed, or does not mention oldshop.
