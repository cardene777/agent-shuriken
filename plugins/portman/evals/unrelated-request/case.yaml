# Asked to add a healthcheck to the Compose file, the agent does not start the skill and runs nothing of
# portman.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Add a healthcheck to the web service in compose.yaml that requests http://localhost:3000/health every 30 seconds.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'portman'
    min: 0
    max: 0
    arm: both
  - name: portman-not-run
    type: tool_used
    tool: Bash
    input_match: 'portman'
    min: 0
    max: 0
    arm: both
