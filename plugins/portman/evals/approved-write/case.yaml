# With the preview already approved in the prompt, the agent writes the portman block into .env.local
# and the Compose override, and keeps the project's own lines in .env.local.
schema_version: "1.1"
name: approved-write
plugins: ["../.."]
execution:
  prompt: |
    I registered the ports of this shop project with portman so its dev server stops clashing with my other projects. I already looked at what portman would change in .env.local and in the Docker Compose override, and I approve it. Write the ports into the project now.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'portman'
    arm: with-only
  - name: env-block
    type: regex
    target: {source: file, path: .env.local}
    pattern: '# >>> portman >>>\nPORT=4417\nPORT_WEB=4417\n# <<< portman <<<'
  - name: env-lines-kept
    type: regex
    target: {source: file, path: .env.local}
    pattern: '(^|\n)NEXT_PUBLIC_SHOP_NAME=Corner Shop\nSHOP_COUPON_CODE=canary-corner-1923\n'
  - name: override-written
    type: regex
    target: {source: file, path: compose.override.yaml}
    pattern: 'ports: !override\n\s+- "4417:3000"'
