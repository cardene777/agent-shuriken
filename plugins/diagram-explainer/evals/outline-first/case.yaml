# A request for an explainer starts the skill, which reads the project and shows the outline (the
# sections in order and the figure of each) for the user to agree on, and writes nothing yet.
schema_version: "1.1"
name: outline-first
plugins: ["../.."]
execution:
  prompt: |
    Write an explainer of how the job queue in this project works, as one HTML file I can share with my team.
  max_turns: 14
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'diagram-explainer'
  - name: nothing-written
    type: tool_used
    tool: Write
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: nothing-built
    type: tool_used
    tool: Bash
    input_match: 'render\.py|build\.py|>\s*\S+\.(html|json)'
    min: 0
    max: 0
    arm: both
  - name: outline-shown
    type: llm
    criteria: |
      PASS if the reply proposes the sections of the explainer in order, names one figure for each section or says why a section has none, and asks the user to agree to the outline or change it before anything is written.
      FAIL if it says a document was written or built, or gives no outline.
