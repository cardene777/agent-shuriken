# Asked for a two-sentence difference between two kinds of tools, the agent answers without starting
# the skill or creating a report.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    In two sentences, what's the difference between a static site generator and a headless CMS?
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'compare-report'
    min: 0
    max: 0
    arm: both
  - name: no-report
    type: tool_used
    tool: Bash
    input_match: 'new-report\.sh'
    min: 0
    max: 0
    arm: both
