# A request to set up a project starts the skill, which looks at the project, says what kind it is,
# and asks what to set up or shows the plan, and writes nothing before the user approves.
schema_version: "1.1"
name: plan-first
plugins: ["../.."]
execution:
  prompt: |
    Set up this project so I can run it locally.
  max_turns: 14
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'init-project'
  - name: nothing-written
    type: tool_used
    tool: Write
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: nothing-applied
    type: tool_used
    tool: Bash
    input_match: 'init_project\.py"?\s+apply|>\s*\S*(Dockerfile|docker-compose|compose\.ya?ml)'
    min: 0
    max: 0
    arm: both
  - name: detected
    type: regex
    target: trace
    pattern: 'kind +web-app'
    arm: with-only
  - name: asked-first
    type: llm
    criteria: |
      PASS if the reply says the project is a web app (Next.js counts) and asks the user what to set up, such as Docker, a local port, or 1Password, or shows a plan and asks for approval, before writing anything.
      A plan that lists files to create is not a failure, as long as the reply says nothing has been written yet.
      FAIL if the reply says files were written or created, or it neither asks nor shows a plan.
