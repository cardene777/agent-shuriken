# The eval sandbox does not let a process listen on a local port, so the plan finds no free port and
# refuses. The agent writes nothing, does not start anything, and tells the user why the Docker files
# were not written and what to do. On a machine where the sandbox allows listening, this case does not
# reach the refusal.
schema_version: "1.1"
name: docker-port-blocked
plugins: ["../.."]
execution:
  prompt: |
    Add Docker to this project for local work. Any free local port is fine. I approve the plan in advance, so write the files without asking me again. Do not start the containers.
  max_turns: 16
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'init-project'
  - name: refused-at-the-port
    type: regex
    target: trace
    pattern: 'No free port from 3100 up'
    arm: with-only
  - name: nothing-written
    type: tool_used
    tool: Write
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: nothing-applied
    type: tool_used
    tool: Bash
    input_match: 'init_project\.py"?\s+apply|>\s*\S*(Dockerfile|docker-compose|compose\.ya?ml)'
    min: 0
    max: 0
    arm: both
  - name: not-started
    type: tool_used
    tool: Bash
    input_match: 'docker[ -]compose\s+up'
    min: 0
    max: 0
    arm: both
  - name: told-why
    type: llm
    criteria: |
      PASS if the reply says the Docker files were not written because no local port could be used or checked, and says what the user can do next, such as running it outside the sandbox or approving the port check.
      Mentioning the port number 3100 or the exit code is not required.
      FAIL if the reply says Docker files were written or containers were started, or gives no reason why nothing was written.
