# Fixing a typo in the README has nothing to set up, so it does not start the skill.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Fix the typo in README.md: "kitchn" should be "kitchen".
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'init-project'
    min: 0
    max: 0
    arm: both
  - name: typo-fixed
    type: regex
    target: {source: file, path: README.md}
    pattern: 'what is in the kitchen,'
