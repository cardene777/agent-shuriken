# The user asks to remember a lesson: the agent shows the rule as a diff and asks for approval, and
# changes no file before the user says yes.
schema_version: "1.1"
name: diff-first
plugins: ["../.."]
execution:
  prompt: |
    Remember this for future sessions in this project: before pushing changes to checkout, run `pnpm test:checkout`, because the unit tests do not cover checkout.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'learning-to-skill'
  - name: proposed
    type: tool_used
    tool: Bash
    input_match: 'learning_to_skill\.py\\?"?\s+propose'
    arm: with-only
  - name: nothing-applied
    type: tool_used
    tool: Bash
    input_match: 'learning_to_skill\.py\\?"?\s+apply'
    min: 0
    max: 0
    arm: both
  - name: no-file-edited
    type: tool_used
    tool: Edit
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: no-file-written
    type: tool_used
    tool: Write
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: agents-unchanged
    type: regex
    target: {source: file, path: AGENTS.md}
    pattern: 'test:checkout'
    match: not_contains
  - name: asks-approval
    type: llm
    criteria: |
      PASS if the reply shows the proposed change (a diff, or the exact line and the file and section it would go in) and asks the user to approve it before anything is written.
      Naming a second place the rule could go, or saying it is waiting for the user's answer, is not a failure.
      FAIL if the reply says the rule was already written to a file, or does not ask the user to approve the change.
