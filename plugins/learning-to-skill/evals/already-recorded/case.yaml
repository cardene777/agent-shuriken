# The rule the user asks to remember is already in AGENTS.md: the agent says where it is and adds
# nothing.
schema_version: "1.1"
name: already-recorded
plugins: ["../.."]
execution:
  prompt: |
    Remember this for future sessions: run `pnpm test:checkout` before pushing changes to checkout.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'learning-to-skill'
  - name: checked
    type: tool_used
    tool: Bash
    input_match: 'learning_to_skill\.py\\?"?\s+check'
    arm: with-only
  - name: nothing-applied
    type: tool_used
    tool: Bash
    input_match: 'learning_to_skill\.py\\?"?\s+apply'
    min: 0
    max: 0
    arm: both
  - name: no-file-edited
    type: tool_used
    tool: Edit
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: no-file-written
    type: tool_used
    tool: Write
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: rule-once
    type: regex
    target: {source: file, path: AGENTS.md}
    pattern: '^(?![\s\S]*test:checkout[\s\S]*test:checkout)[\s\S]*test:checkout'
  - name: says-it-is-there
    type: llm
    criteria: |
      PASS if the reply says the rule is already in AGENTS.md (naming the file, its Testing section, or the line) and that nothing needs to be added.
      Offering to sharpen or reword the existing line is not a failure.
      FAIL if the reply says it added the rule, or proposes adding a second line with the same rule.
