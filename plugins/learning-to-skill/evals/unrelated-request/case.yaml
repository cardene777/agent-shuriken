# An ordinary request with no lesson in it: the skill does not start and no instruction file changes.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Fix the typo in README.md.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'learning-to-skill'
    min: 0
    max: 0
    arm: both
  - name: typo-fixed
    type: regex
    target: {source: file, path: README.md}
    pattern: 'A small online shop'
  - name: agents-unchanged
    type: regex
    target: {source: file, path: AGENTS.md}
    pattern: '^# AGENTS\.md\n\n## Setup\n\n- Install dependencies with `pnpm install`\.\n\n## Testing\n\n- Run `pnpm test` before opening a pull request\.\n$'
