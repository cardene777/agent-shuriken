# A short question about git, asked inside a project, must not start the skill.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    What is the difference between git merge and git rebase? Answer in two sentences.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'techdebt'
    min: 0
    max: 0
    arm: both
  - name: no-scan
    type: tool_used
    tool: Bash
    input_match: 'techdebt\.py'
    min: 0
    max: 0
    arm: both
