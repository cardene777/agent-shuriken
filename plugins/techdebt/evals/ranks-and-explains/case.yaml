# Asked where the debt is, the agent scans the project, writes a note for the top files and attaches the
# notes with explain, and changes no code. A copy at out/report.html gives the graders a fixed path, since
# the report itself is written under the run's HOME.
schema_version: "1.1"
name: ranks-and-explains
plugins: ["../.."]
execution:
  prompt: |
    Where is the technical debt in this repository, and what should we fix first? When you're done, copy the report to out/report.html so I can share it with the team.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'techdebt'
    arm: with-only
  - name: scanned
    type: tool_used
    tool: Bash
    input_match: 'techdebt\.py\\?"?(?:\s|\\n)+scan'
    arm: with-only
  - name: notes-attached
    type: regex
    target: {source: file, path: out/report.html}
    pattern: '"ledger/billing\.py": \{"what": "(?:[^"\\]|\\.)+", "why": "(?:[^"\\]|\\.)+", "action": "(?:[^"\\]|\\.)+"\}'
  - name: code-unchanged
    type: regex
    target: {source: file, path: ledger/billing.py}
    pattern: 'def apply_discounts\(order\):\n    # TODO: move the coupon table out of this function before the spring release\n'
  - name: no-code-edit
    type: tool_used
    tool: Edit
    input_match: 'ledger/'
    min: 0
    max: 0
    arm: both
