<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} tech debt</title>
<style>
/* Lines between rows stand out from the card, the stripe, and the selected row by 3 to 1 or more.
   Good, warn, and critical are kept apart from the blue accent. */
:root {
  --bg: #f6f7f9; --fg: #1d2330; --muted: #5b6475; --card: #ffffff; --stripe: #f4f6f9; --selected: #e6edfb;
  --label: #eef1f6; --line: #7f8796; --track: #dfe4ec; --code: #eef1f6; --shadow: rgba(29, 35, 48, 0.22);
  --accent: #2f5bd3; --accent-ink: #ffffff;
  --good: #1f7a3e; --good-soft: #e3f4e8; --warn: #9a5a06; --warn-soft: #fdf0dc; --critical: #c4314b; --critical-soft: #fbe7eb;
  --radius: 10px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --fg: #e7eaf0; --muted: #a3abba; --card: #1b2029; --stripe: #20262f; --selected: #22304d;
    --label: #232a36; --line: #767f90; --track: #343b48; --code: #232a36; --shadow: rgba(0, 0, 0, 0.55);
    --accent: #6d8ff0; --accent-ink: #12151b;
    --good: #5cc285; --good-soft: #1a3324; --warn: #e5a43a; --warn-soft: #3a2c14; --critical: #f07f8f; --critical-soft: #3d1c22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --fg: #e7eaf0; --muted: #a3abba; --card: #1b2029; --stripe: #20262f; --selected: #22304d;
  --label: #232a36; --line: #767f90; --track: #343b48; --code: #232a36; --shadow: rgba(0, 0, 0, 0.55);
  --accent: #6d8ff0; --accent-ink: #12151b;
  --good: #5cc285; --good-soft: #1a3324; --warn: #e5a43a; --warn-soft: #3a2c14; --critical: #f07f8f; --critical-soft: #3d1c22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: 13px; overflow-wrap: break-word; }
/* The header and the content share one width and one left edge. */
.top-in, main { max-width: 1200px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
header { border-bottom: 1px solid var(--line); background: var(--card); }
.top-in { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; padding-top: 16px; padding-bottom: 14px; }
.top-in > div:first-child { flex: 1 1 560px; min-width: 0; }
header h1 { margin: 0 0 6px; font-size: 20px; line-height: 1.35; }
/* One row per fact, its bold name beside its value: in a line on wide screens, and one under another below 860px. */
.facts-wrap { max-width: 100%; }
.facts { border-collapse: collapse; font-size: 13px; }
.facts, .facts tbody { display: block; }
.facts tbody { display: flex; flex-wrap: wrap; gap: 2px 20px; }
.facts tr { display: flex; gap: 6px; align-items: baseline; }
.facts th, .facts td { padding: 0; border: 0; text-align: left; background: none; }
.facts th { font-weight: 600; color: var(--muted); white-space: nowrap; }
.facts td { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (max-width: 860px) {
  .facts tbody { display: grid; gap: 2px; }
  .facts tr { display: grid; grid-template-columns: 11em minmax(0, 1fr); gap: 8px; }
  .facts th { white-space: normal; }
}
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 6px 14px; min-height: 36px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
main { padding-top: 20px; padding-bottom: 56px; }
/* A notice that holds for the whole report sits first in the content. */
.banner { display: flex; gap: 12px; align-items: flex-start; margin: 0 0 16px; padding: 12px 16px; border: 1px solid var(--warn); border-left-width: 4px; border-radius: var(--radius); background: var(--warn-soft); }
.banner svg { flex: none; color: var(--warn); margin-top: 3px; }
.banner strong { display: block; }
.banner p { margin: 2px 0 0; }
/* The band: every card stacks its number, label, and note from the top, so the numbers share one line.
   Japanese labels break only at the phrase breaks the dictionary marks with ​. */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
@media (min-width: 1100px) { .cards { grid-template-columns: repeat(9, minmax(0, 1fr)); } }
.card { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 2px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  text-align: left; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card .n { display: flex; align-items: center; min-height: 34px; font-size: 26px; line-height: 1.2; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .n.none { font-size: 13px; font-weight: 600; word-break: keep-all; }
.card .l { color: var(--muted); font-size: 13px; line-height: 1.4; word-break: keep-all; overflow-wrap: normal; }
.card .sub { color: var(--muted); font-size: 12px; line-height: 1.4; word-break: keep-all; }
.tabs { position: relative; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 4px 0 18px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs [role="tab"] { flex: none; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); padding: 10px 12px; min-height: 44px;
  font: inherit; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
.tabs [role="tab"]:hover { color: var(--fg); }
.tabs [role="tab"]:focus-visible { outline-offset: -3px; }
.tabs [role="tab"][aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.lead { color: var(--muted); margin: 0 0 12px; max-width: 76em; }
.measure { margin: 0 0 40px; }
.measure > h3, .tool > h3 { margin: 0 0 4px; font-size: 18px; line-height: 1.4; }
.tool > h3 { font-family: var(--mono); font-size: 17px; }
.tool { margin: 0 0 32px; }
.tool .state { margin: 0 0 12px; }
/* A warning sits in its own block right after the explanation it qualifies. */
.caution { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--warn); border-radius: 8px; background: var(--warn-soft); }
.caution svg { flex: none; color: var(--warn); margin-top: 3px; }
.caution strong { display: block; }
.caution p { margin: 2px 0 0; }
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin: 0 0 10px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select { min-height: 40px; padding: 8px 10px; font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.field input { width: min(320px, 80vw); }
.count { margin: 0 0 8px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.pager { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin: 10px 0; }
.pager button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 40px; min-height: 40px; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; }
.pager button:hover { border-color: var(--accent); }
.pager button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pager .gap { min-width: 20px; text-align: center; color: var(--muted); }
/* Tables: the header row and the name column stay in view, and a wide table scrolls sideways inside its
   focusable region, with a shadow on the side that has more. */
table { border-collapse: separate; border-spacing: 0; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; font-size: 14px; overflow-wrap: break-word; }
th { font-weight: 600; }
.table-scroll { position: relative; width: fit-content; max-width: 100%; overflow: auto; max-height: min(78vh, 900px); border: 1px solid var(--line); border-radius: var(--radius);
  background:
    linear-gradient(to right, var(--card) 30%, transparent) left center / 32px 100% no-repeat local,
    linear-gradient(to left, var(--card) 30%, transparent) right center / 32px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, var(--shadow), transparent) left center / 12px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) right center / 12px 100% no-repeat scroll;
  background-color: var(--card); }
.table-scroll:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.table-scroll table { width: auto; max-width: 100%; }
.table-scroll thead th { position: sticky; top: 0; z-index: 2; background: var(--label); border-bottom: 1px solid var(--line); white-space: nowrap; }
.table-scroll thead th:first-child { left: 0; z-index: 3; }
.table-scroll tbody th[scope="row"] { position: sticky; left: 0; z-index: 1; background: var(--card); font-weight: 400; box-shadow: inset -1px 0 0 var(--line); }
.table-scroll tbody tr > * { border-bottom: 1px solid var(--line); }
.table-scroll tbody tr:last-child > * { border-bottom: 0; }
.striped tbody tr:nth-child(even) > * { background: var(--stripe); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
.sort { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
.sort svg { color: var(--muted); }
th[aria-sort] .sort svg { color: var(--accent); }
.barcell { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; }
.bar { display: block; flex: none; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.barcell .bar { width: 96px; }
.bar i { display: block; height: 100%; min-width: 2px; background: var(--accent); border-radius: 4px; }
/* The state of a tool as a tag: its icon and its word, never its color alone. */
.tag { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; padding: 1px 9px 1px 7px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1.6; white-space: nowrap; vertical-align: 1px; }
.tag svg { flex: none; }
.tag.good { color: var(--good); background: var(--good-soft); }
.tag.warn { color: var(--warn); background: var(--warn-soft); }
.tag.crit { color: var(--critical); background: var(--critical-soft); }
.block + .block, .block + .empty { margin-top: 16px; }
.empty { padding: 28px 20px; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--card); text-align: center; }
.empty h4 { margin: 0 0 4px; font-size: 17px; line-height: 1.4; }
.empty p { margin: 0; color: var(--muted); }
/* The ranked list on the left and the pressed row's details beside it, each scrolling on its own. */
.split { display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.list { min-width: 0; }
.list > h2 { margin: 0 0 8px; font-size: 16px; line-height: 1.4; }
.ranked-wrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.ranked { width: 100%; }
.ranked thead th { position: sticky; top: 0; z-index: 2; background: var(--label); border-bottom: 1px solid var(--line); font-size: 13px; }
.ranked thead th:first-child { border-top-left-radius: var(--radius); }
.ranked thead th:last-child { border-top-right-radius: var(--radius); }
.ranked tbody tr { cursor: pointer; }
.ranked tbody tr > * { border-bottom: 1px solid var(--line); vertical-align: middle; transition: background-color .15s; }
.ranked tbody tr:last-child > * { border-bottom: 0; }
.ranked tbody tr:hover > * { background: var(--stripe); }
.ranked tbody tr.current > * { background: var(--selected); }
.ranked tbody tr.current > th { box-shadow: inset 3px 0 0 var(--accent); }
.ranked tbody th { font-weight: 400; }
.rank { display: flex; gap: 10px; align-items: flex-start; }
.no { flex: none; min-width: 1.6em; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.name { min-width: 0; }
.pick { display: block; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.file { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.file .dir { color: var(--muted); }
.file b { font-weight: 700; }
/* A path shows its file name first and its folder under it, and breaks only after a slash. */
.path { display: flex; flex-direction: column-reverse; }
.path .dir { font-size: 12.5px; font-weight: 400; }
.name small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); line-height: 1.45; }
.value { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.value .bar { width: 56px; }
.score { font-weight: 700; font-variant-numeric: tabular-nums; }
.value svg { flex: none; color: var(--muted); }
.detail { display: grid; gap: 12px; align-content: start; padding: 0 20px 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.detail-head { position: sticky; top: 0; z-index: 1; display: flex; gap: 10px; align-items: flex-start; padding: 16px 0 10px; background: var(--card); border-bottom: 1px solid var(--line); }
.detail h2 { margin: 0; font-size: 18px; line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 2px 10px; border-radius: 999px; background: var(--label); font-size: 13px; }
.kv { width: 100%; border-collapse: collapse; }
.kv th { width: 8.5em; padding: 8px 12px 8px 0; color: var(--muted); border-top: 1px solid var(--line); }
.kv td { padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.back, .step { display: none; }
@media (min-width: 861px) {
  .split .list, .split .detail { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; overflow-x: hidden; }
  .split .list { padding: 2px; }
}
/* Below 860px the list and the details take turns: a row opens its details, which lead back to the
   list and on to the rows before and after it. */
@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .split[data-view="list"] .detail { display: none; }
  .split[data-view="detail"] .list { display: none; }
  .detail { padding: 0 16px 16px; }
  .back { display: inline-flex; justify-self: start; align-items: center; gap: 6px; min-height: 40px; margin-top: 12px; padding: 6px 12px 6px 8px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
  .step { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .step a { display: grid; gap: 2px; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
  .step a[rel="next"] { grid-column: 2; text-align: right; }
  .step .k { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--accent); }
  .step a[rel="next"] .k { justify-content: flex-end; }
  .step .file { font-size: 13px; }
}
/* How each value was measured, under the tabs on every tab: tables, and label and value lists on phones. */
.how { display: grid; gap: 12px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
.how > h2 { margin: 0; font-size: 18px; }
.how > h3 { margin: 12px 0 0; font-size: 16px; }
.how-list { display: none; margin: 0; padding: 0; list-style: none; }
@media (max-width: 599px) {
  .how .table-scroll { display: none; }
  .how-list { display: grid; gap: 10px; }
  .how-list li { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
  .how-list h3, .how-list h4 { margin: 0 0 6px; font-size: 15px; }
  .how-list dl { display: grid; gap: 2px; margin: 0; }
  .how-list dt { font-size: 13px; font-weight: 600; color: var(--muted); }
  .how-list dd { margin: 0 0 6px; }
  .pager .word { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .pager button { padding: 6px; }
}
.page-error { max-width: 560px; margin: 48px auto; padding: 28px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.page-error h2 { margin: 0 0 6px; font-size: 20px; }
.page-error p { margin: 0 0 16px; color: var(--muted); }
.page-error button { min-height: 40px; padding: 8px 18px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
@media (max-width: 640px) {
  .top-in, main { padding-left: 16px; padding-right: 16px; }
  .top-in { padding-top: 12px; padding-bottom: 12px; }
  main { padding-top: 16px; padding-bottom: 40px; }
  .card { padding: 10px; }
  th, td { padding: 6px 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div class="top-in">
    <div>
      <h1 id="title"></h1>
      <div class="facts-wrap"><table class="facts" id="facts" role="table"></table></div>
    </div>
    <div class="controls">
      <div class="seg" id="lang-group" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ja">日本語</button>
      </div>
      <div class="seg" id="theme-group" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light"></button>
        <button type="button" data-theme-choice="dark"></button>
      </div>
    </div>
  </div>
</header>
<main>
  <section class="cards" id="cards"></section>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="panel" role="tabpanel"></section>
  <section class="how" id="how" aria-labelledby="how-title"></section>
</main>
<p class="sr-only" id="status" role="status"></p>
<script>
const PAYLOAD = /*TECHDEBT_DATA*/null;
const I18N = {
  en: {
    title: "Technical debt in {p}", titleNoData: "Technical debt report",
    langGroup: "Language", themeGroup: "Theme", light: "Light", dark: "Dark",
    factsCaption: "About this scan",
    factCommit: "Commit", factBranch: "Branch", factFiles: "Source files", factCommits: "Commits in the last {months} months",
    factGenerated: "Generated", factGit: "Git history", notGit: "Not a git repository",
    bannerTitle: "Not a git repository",

    errorTitle: "This report has no data",
    errorText: "The page was opened before the scan wrote its results into it. Run the scan again and open the report it writes.",
    reload: "Reload",
    tabsLabel: "Parts of the report", tabCount: " ({n})",
    tabStart: "Priorities", tabHistory: "Change history", tabCode: "Code", tabDeps: "Dependencies", tabTools: "Tools",
    start: "Priority score", hotspots: "Hotspots", markers: "Markers", untested: "No matching test file", functions: "Long functions",
    large: "Large files", dup: "Duplication", deps: "Unused dependencies", deprecated: "Deprecated calls", tools: "Tools",
    cStart: "files ranked", cHot: "hotspots", cMarkers: "markers", cUntested: "no matching test file",
    cFunctions: "long functions", cLarge: "large files", cDup: "duplicated lines", cDeps: "unused dependencies", cDeprecated: "deprecated calls",
    notMeasured: "Not measured", approxByName: "approximate, found by name",
    leadStart: "Files ranked by how often they change, their size, long functions, markers, duplication, and whether a test file of a matching name exists. Press a row to see its details. Fixing the top files pays off first, because people keep working in them.",
    leadHot: "Files changed 2 or more times in the last {months} months, ranked by changes multiplied by non-blank lines.",
    leadMarkers: "TODO, FIXME, HACK, XXX, and deprecation markers in comments, oldest first. The age comes from git blame.",
    leadUntested: "Source files of 20 or more lines with no test file of a matching name (for example foo.py and test_foo.py). Tests are not run and coverage is not measured. Busiest first.",
    leadFunctions: "Functions over {n} lines. Python is measured exactly; other languages by matching braces, so treat those as approximate.",
    leadLarge: "Source files over {n} non-blank lines.",
    leadDup: "Blocks of {n} or more lines, ignoring whitespace, imports, and comments, that appear in two places.",
    leadDepsSearch: "Dependencies in package.json whose names were not found in any import, require, config file, or scripts entry, counting packages that a used package needs as a peer and plugins named by their short names.",
    leadDepsKnip: "Dependencies in package.json that knip found unused.",
    cautionTitle: "Check before removing",
    cautionText: "The names were searched for as text, so a dependency that is used in another way can be listed. Check each one before removing it.",
    leadDeprecated: "Calls to APIs that a library or the language marks as deprecated, found by tools already installed in the project. ruff uses its rules for deprecated imports, aliases, and functions. semgrep runs only the project's own rules, with metrics off, and its findings about deprecation are listed here. ESLint runs when its config turns on a deprecation rule. A tool that did not run is listed with the reason.",

    el("th", {scope: "row"}, el("div", {class: "rank"}, el("span", {class: "no"}, i + 1),
      el("div", {class: "name"},
        el("button", {type: "button", class: "pick file path", "aria-describedby": (n ? "note-" + i + " " : "") + "score-" + i, "aria-current": on ? "true" : null, onclick: () => choose(i)}, pathParts(r.file)),
        n ? el("small", {id: "note-" + i}, n.what) : null))),
    el("td", {class: "num"}, el("div", {class: "value"},
      el("span", {class: "bar", "aria-hidden": "true"}, el("i", {style: "width:" + Math.min(100, r.score / top * 100).toFixed(1) + "%"})),
      el("span", {id: "score-" + i, class: "score"}, two(r.score)), icon("right"))));
}
function detail(i) {
  const r = D.ranked[i], n = NOTES[r.file];

  if (n) fields.push(["what", n.what], ["why", n.why], ["action", n.action]);
  const link = (j, rel) => el("a", {rel, href: hashOf(j), onclick: (e) => { e.preventDefault(); step(j); }},
    el("span", {class: "k"}, rel === "prev" ? icon("left", 14) : null, t(rel === "prev" ? "prevFile" : "nextFile"), rel === "next" ? icon("right", 14) : null),
    el("span", {class: "file path"}, pathParts(D.ranked[j].file)));

    el("button", {type: "button", class: "back", onclick: back}, icon("left"), t("back")),

function startPanel() {

  const R = D.ranked;
  if (!R.length) return out.concat(empty("emptyStart", "emptyStartText"));
  if (pick >= R.length) pick = 0;
  const pages = Math.ceil(R.length / PAGE);
  rankPage = Math.min(rankPage, pages - 1);

  const go = (p) => {

// Shows the picked row in place, so the list keeps its scroll and the pressed button keeps the focus.
function syncStart() {

// A pressed row: beside the list on a wide screen, or in place of the list below 860px, where the

function choose(i) {

    focusOn($("detail-title"));
  } else {
    syncStart();

// The previous and next rows replace the open row in the history, so Back still leads to the list.
function step(i) {

// The way back shows the list at once, with the focus on the row that was open.
function back() {

const PANELS = {
  start: startPanel,
  history: () => [SECTIONS.hotspots(), SECTIONS.markers()],
  code: () => [SECTIONS.untested(), SECTIONS.functions(), SECTIONS.large(), SECTIONS.dup()],
  deps: () => [SECTIONS.deps(), SECTIONS.deprecated()],
  tools() {
    const out = [el("p", {class: "lead"}, t("leadTools"))];
    if (!D.tools.length) return out.concat(empty("emptyTools", "emptyToolsText"));
    for (const tool of byState(D.tools)) {

      const sec = el("section", {class: "tool", "aria-labelledby": id}, el("h3", {id, tabindex: "-1"}, tool.tool),
        el("p", {class: "state"}, result(tool, tool.findings.length)));

        : tableBlock({id: id, heading: id, rows: tool.findings, sort: 0, dir: "ascending", filter: {key: "filterRule", val: f => f.rule}, cols: [
          col("file", f => atKey(f.file, f.line), {code: true, text: f => at(f.file, f.line)}),
          col("rule", f => f.rule, {code: true}),

      out.push(sec);
    }
    return out;
  },
};

// The measures and the tools, under the tabs on every tab: tables, and the same rows as lists below 600px.
function how() {
  const tools = new Map();
  for (const s of D.tools.concat(D.deprecated_calls.tools)) if (!tools.has(s.tool)) tools.set(s.tool, s);
  const rows = byState([...tools.values()]);
  const found = (s) => (s.findings ? s.findings.length : callsOf(s.tool));
  const head = (...keys) => el("thead", null, el("tr", null, keys.map(k => el("th", {scope: "col"}, t(k)))));
  const region = (label, table) => el("div", {class: "table-scroll", role: "region", tabindex: "0", "aria-labelledby": label}, table);
  return [
    el("h2", {id: "how-title"}, t("howTitle")),
    region("how-title", el("table", {class: "how-table", "aria-labelledby": "how-title"}, head("howMeasure", "howWay"),
      el("tbody", null, HOW.map(([id, text]) => el("tr", {"data-measure": id}, el("th", {scope: "row"}, t(id)), el("td", null, text())))))),
    el("ul", {class: "how-list", "aria-labelledby": "how-title"}, HOW.map(([id, text]) =>

        el("dt", null, t("result")), el("dd", null, result(s, found(s))))))),

}

// A page opened before scan wrote its data says so and offers a way forward instead of the report.
function noData() {
  document.title = t("titleNoData");
  $("title").textContent = t("titleNoData");
  for (const id of ["cards", "tabs", "panel", "how"]) $(id).hidden = true;
  document.querySelector(".facts-wrap").hidden = true;
  const box = el("section", {class: "page-error", "aria-labelledby": "error-title"},
    el("h2", {id: "error-title", tabindex: "-1"}, t("errorTitle")), el("p", null, t("errorText")),
    el("button", {type: "button", onclick: () => location.reload()}, t("reload")));
  const old = document.querySelector(".page-error");
  if (old) old.replaceWith(box); else document.querySelector("main").prepend(box);
}

function render() {
  document.documentElement.lang = lang;
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  for (const b of document.querySelectorAll("[data-theme-choice]")) b.textContent = t(b.dataset.themeChoice);
  $("lang-group").setAttribute("aria-label", t("langGroup"));
  $("theme-group").setAttribute("aria-label", t("themeGroup"));
  if (!D) return noData();
  document.title = t("title", {p: D.project});
  $("title").textContent = t("title", {p: D.project});
  // One row per fact, the name in a row header and the value beside it, as page-design shows facts, never one sentence.
  const stamp = D.generated_at.slice(0, 16);
  const when = el("time", {datetime: stamp}, stamp.replace("T", " "));
  const facts = D.git
    ? [["factCommit", D.head], ["factBranch", D.branch], ["factFiles", D.files], ["factCommits", D.commits], ["factGenerated", when]]
    : [["factGit", t("notGit")], ["factFiles", D.files], ["factGenerated", when]];
  $("facts").replaceChildren(el("caption", {class: "sr-only"}, t("factsCaption")), el("tbody", {role: "rowgroup"}, ...facts.map(([k, v]) =>
    el("tr", {role: "row"}, el("th", {scope: "row", role: "rowheader"}, t(k, {months: D.months})), el("td", {role: "cell"}, v)))));
  const main = document.querySelector("main"), old = main.querySelector(":scope > .banner");
  if (old) old.remove();
  if (!D.git) main.prepend(el("div", {class: "banner"}, icon("alert", 18), el("div", null, el("strong", null, t("bannerTitle")), el("p", null, t("bannerText")))));
  $("cards").replaceChildren(...CARDS.map(([id, key, n]) => {
    const v = n();
    const approx = id === "deps" && v !== null && D.unused_dependencies.source === "search";
    return el("button", {type: "button", class: "card", "data-measure": id, onclick: () => showMeasure(id)},
      v === null ? el("span", {class: "n none"}, t("notMeasured")) : el("span", {class: "n"}, v),

function selectTab(id, focus) {

// The URL fragment keeps the open row (#item-<path>), the tab (#<tab>), or a measure (#<measure>), and

function fromHash() {

    let path = h.slice(5);

  }

  if (!first && tab === "start" && panelTab === "start" && $("split")) syncStart(); else render();
  if (s.measure) focusOn($("h-" + s.measure));

for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("techdebt-lang", lang); } catch (e) {}
  render();
});
for (const b of document.querySelectorAll("[data-theme-choice]")) b.addEventListener("click", () => {
  setTheme(b.dataset.themeChoice);
  try { localStorage.setItem("techdebt-theme", theme); } catch (e) {}
});
// The tabs move with the arrow keys, Home, and End, and the tab that gets the focus is shown.
$("tabs").addEventListener("keydown", (e) => {
  const ids = TABS.map(([id]) => id), n = ids.length;
  let i = ids.indexOf(tab);
  if (e.key === "ArrowRight") i = (i + 1) % n;
  else if (e.key === "ArrowLeft") i = (i - 1 + n) % n;
  else if (e.key === "Home") i = 0;
  else if (e.key === "End") i = n - 1;
  else return;
  e.preventDefault();
  selectTab(ids[i], true);
});
setTheme(theme);
if (D) {
  applyHash(true);
  window.addEventListener("hashchange", () => applyHash(false));
  NARROW.addEventListener("change", render);

  render();
  focusOn($("error-title"));
}
