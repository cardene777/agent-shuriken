<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} tech debt</title>
<style>
:root {
  --bg: #f7f7f5; --fg: #1d2024; --muted: #5d636b; --card: #ffffff; --line: #e3e3de;
  --accent: #8a5d0c; --accent-soft: #f6ecd8; --bar: #9a6a12; --bar2: #e7c98d; --track: #c9c2b2;
  --code: #f1f1ed; --good: #2f7a4a; --warn: #b4364a; --accent-ink: #ffffff;
  --radius: 10px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191c; --fg: #e8e8e4; --muted: #a2a7ad; --card: #202328; --line: #33373d;
    --accent: #e0a63a; --accent-soft: #33291a; --bar: #d29a2f; --bar2: #6d5428; --track: #4a5059;
    --code: #2a2d32; --good: #6cc08d; --warn: #f07f8f; --accent-ink: #17191c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17191c; --fg: #e8e8e4; --muted: #a2a7ad; --card: #202328; --line: #33373d;
  --accent: #e0a63a; --accent-soft: #33291a; --bar: #d29a2f; --bar2: #6d5428; --track: #4a5059;
  --code: #2a2d32; --good: #6cc08d; --warn: #f07f8f; --accent-ink: #17191c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* The header and the content share one width and one left edge. */
.top-in, main { max-width: 1200px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
header { border-bottom: 1px solid var(--line); background: var(--card); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; padding-bottom: 16px; }
header h1 { margin: 0; font-size: 20px; }
.facts { margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 2px 24px; font-size: 13px; }
.facts div { display: flex; gap: 6px; align-items: baseline; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 6px 14px; font: inherit; cursor: pointer; white-space: nowrap; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
main { padding-top: 20px; padding-bottom: 48px; }
/* The band: every card stacks its number, label, and note from the top, so the numbers share one line.
   Japanese labels break only at the phrase breaks the dictionary marks with ​. */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
@media (min-width: 1100px) { .cards { grid-template-columns: repeat(9, minmax(0, 1fr)); } }
.card { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 2px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  text-align: left; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s; }
.card:hover { border-color: var(--accent); }
.card .n { display: flex; align-items: center; min-height: 34px; font-size: 26px; line-height: 1.2; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .n.none { font-size: 13px; font-weight: 600; word-break: keep-all; }
.card .l { color: var(--muted); font-size: 13px; line-height: 1.4; word-break: keep-all; overflow-wrap: normal; }
.card .sub { color: var(--muted); font-size: 12px; line-height: 1.4; word-break: keep-all; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 10px; font: inherit;
  cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; transition: color .15s, border-color .15s; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.lead { color: var(--muted); margin: 0 0 14px; }
/* The ranked list on the left and the pressed row's details beside it, as page-design's report page. */
.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.list { display: grid; gap: 10px; min-width: 0; }
.rows { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
.rows-head, .row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 104px; gap: 12px; align-items: center; padding: 10px 16px; }
.rows-head { padding-top: 8px; padding-bottom: 8px; background: var(--code); color: var(--muted); font-size: 13px; }
.rows-head span { white-space: nowrap; }
.rows-head .num { text-align: right; }
.row { width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit; font: inherit;
  text-align: left; cursor: pointer; transition: background-color .15s; }
.row:hover { background: var(--bg); }
.row[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.no { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.file { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.file .dir { color: var(--muted); }
.file b { font-weight: 700; }
/* The row keeps two lines of the note; the details beside the list show all of it. */
.name small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin-top: 2px; font-size: 13px; color: var(--muted); line-height: 1.45; }
.value { display: grid; gap: 4px; justify-items: end; }
.score { font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { display: block; width: 100%; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; min-width: 4px; background: var(--bar); border-radius: 4px; }
.detail { position: sticky; top: 16px; display: grid; gap: 12px; padding: 18px 20px; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); animation: show .2s ease-out; }
.detail-head { display: flex; gap: 10px; align-items: baseline; }
.detail h2 { margin: 0; font-size: 18px; line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; font-size: 13px; white-space: nowrap; }
.kv { width: 100%; border-collapse: collapse; border: 0; background: transparent; }
.kv th { width: 132px; padding: 8px 12px 8px 0; text-align: left; vertical-align: top; font-weight: 500; color: var(--muted); background: transparent; border-top: 1px solid var(--line); border-bottom: 0; }
.kv td { padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 0; font-size: 15px; }
@keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
th { background: var(--code); font-weight: 600; }
td.num, th.num { text-align: right; white-space: nowrap; }
td code, .mono { font-family: var(--mono); font-size: 13px; word-break: break-all; }
code.said { font-family: var(--mono); font-size: 13px; word-break: normal; overflow-wrap: anywhere; }
.state code.said, .status code.said, .how code.said { display: block; margin-top: 2px; }
.tablewrap { overflow-x: auto; }
.pager { display: flex; justify-content: center; align-items: center; gap: 4px; margin: 12px 0; flex-wrap: wrap; }
.list .pager { margin: 0; }
.pager button { min-width: 36px; padding: 6px 10px; border: 1px solid var(--line); background: var(--card);
  color: var(--fg); border-radius: 6px; font: inherit; cursor: pointer; }
.pager button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pager button:disabled { opacity: 0.4; cursor: default; }
.chart { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 16px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--fg); font: 12px var(--font); }
.chart .lbl { fill: var(--muted); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin: 4px 4px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tool { margin-bottom: 20px; }
.tool h3 { margin: 0 0 2px; font-size: 16px; }
.tool .state { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
.status { margin: 0 0 14px; }
.status td:first-child, .how td:first-child { white-space: nowrap; }
.status td:first-child code, .how td:first-child code { word-break: normal; }
/* How each value was measured, under the tabs on every tab. */
.how { margin-top: 32px; display: grid; gap: 10px; }
.how h2 { margin: 0; font-size: 18px; }
.how h3 { margin: 10px 0 0; font-size: 16px; }
.how .measure-name { font-weight: 600; }
.tools-table th:nth-child(2) { width: 26em; }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); padding: 16px; color: var(--muted); }
@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .detail { position: static; }
}
@media (max-width: 640px) {
  .top-in, main { padding-left: 16px; padding-right: 16px; }
  .top-in { padding-top: 12px; padding-bottom: 12px; }
  main { padding-top: 16px; padding-bottom: 40px; }
  .card { padding: 10px; }
  .rows-head, .row { grid-template-columns: 32px minmax(0, 1fr) 72px; gap: 10px; padding-left: 12px; padding-right: 12px; }
  th, td { padding: 6px 8px; }
  /* On a phone each name sits on its own line above its text, so neither column is squeezed. */
  .kv th, .kv td, .how-table td { display: block; width: auto; }
  .kv th { padding: 8px 0 0; }
  .kv td { padding: 2px 0 8px; border-top: 0; }
  .how-table thead { display: none; }
  .how-table tr { display: block; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .how-table td { border-bottom: 0; padding: 2px 10px; }
  .how td:first-child { white-space: normal; font-weight: 600; }
  .tools-table td:nth-child(2) { color: var(--muted); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<header>
  <div class="top-in">
    <div>
      <h1 id="title"></h1>
      <dl class="facts" id="facts"></dl>
    </div>
    <div class="controls">
      <div class="seg" id="lang-group" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ja">日本語</button>
      </div>
      <div class="seg" id="theme-group" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light"></button>
        <button type="button" data-theme-choice="dark"></button>
      </div>
    </div>
  </div>
</header>
<main>
  <section class="cards" id="cards"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section id="panel" role="tabpanel"></section>
  <section class="how" id="how"></section>
</main>

    howStart: "ソースファイルごとに0から1の点数を付けます。変更の回数と行数の積が40%です。長い関数は20%です。TODOなどと重複した行は15%ずつです。名前の合うテストファイルが無いファイルの変更の回数は10%です。上位20件を並べます。",
    howHot: "直近{months}か月にファイルを変えたコミットの数をgit logから数えます。2回以上変えたファイルを、変更の回数と空行を除いた行数の積の順に並べます。",
    howHotNone: "測っていない値です。gitのリポジトリの外なので、変更の回数を数えられません。",
    howMarkers: "コメントにあるTODO、FIXME、HACK、XXXと、@deprecatedなどの非推奨の書き込みです。FIXMEとHACKは2つ分に数えます。古さはgit blameで調べます。",
    howUntested: "20行以上のソースファイルごとに、名前の合うテストファイル(foo.pyに対するtest_foo.pyなど)を探します。テストを動かしたり網羅率を測ったりはしません。",
    howFunctions: "{n}行を超える関数です。Pythonは正確に測り、ほかの言語は波括弧の対応で測るので目安です。",
    howFunctionsNone: "{langs}は測っていません。",
    howLarge: "空行を除いて{n}行を超えるソースファイルです。",
    howDup: "空白、import、コメントを除いて{n}行以上同じ並びが2か所にある部分です。",
    howDepsKnip: "knipで調べました。",
    howDepsSearch: "概算です。knipが動かなかったので、package.jsonの依存の名前をimport、require、設定のファイル、scriptsで探しました。",
    howDepsNone: "測っていない値です。package.jsonが無いので依存を調べていません。",
    howDeprecated: "動いたツール({tools})で探しました。動かなかったツールは理由と一緒に下の表にあります。",
    howDeprecatedNone: "測っていない値です。ruffもsemgrepもESLintも動かなかったので探していません。理由は下の表にあります。",
    useKnip: "使っていない依存とファイルとexport", useRuff: "Pythonの指摘と非推奨の呼び出し",
    useSemgrep: "プロジェクトの規則の指摘と非推奨の呼び出し", useEslint: "設定で有効な非推奨の規則に当たる呼び出し"
  }
};
const D = PAYLOAD.data, NOTES = PAYLOAD.notes || {};
const PAGE = 50;
let lang = "en", tab = "start";
// pick is the ranked row whose details sit beside the list.
let pick = 0;
const pages = {};
try { const s = localStorage.getItem("techdebt-lang"); if (s === "ja" || s === "en") lang = s; } catch (e) {}
// The theme follows the system until the reader picks one, which is kept like the language.
let theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { const s = localStorage.getItem("techdebt-theme"); if (s === "light" || s === "dark") theme = s; } catch (e) {}
function setTheme(mode) {
  theme = mode;
  document.documentElement.dataset.theme = mode;
  for (const b of document.querySelectorAll("[data-theme-choice]")) b.setAttribute("aria-pressed", String(b.dataset.themeChoice === mode));
}
function show(id) {
  tab = id;
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  render();
}

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  for (const k in (vars || {})) s = s.split("{" + k + "}").join(String(vars[k]));
  return s;
}
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function age(d) {
  if (d == null) return t("notCommitted");
  if (d < 60) return t("days", {n: d});
  if (d < 730) return t("months", {n: Math.round(d / 30.4)});
  const y = Math.floor(d / 365.25), m = Math.floor((d - y * 365.25) / 30.4);
  return t("years", {n: y, m: m});
}
function reason(r) {
  if (r.key === "changes" && r.value === 1) return t("rChangesOne");
  if (r.key === "long_functions" && r.value === 1) return t("rLongOne");
  const key = {changes: "rChanges", lines: "rLines", long_functions: "rLong", markers: "rMarkers", dup_lines: "rDup", untested: "rUntested"}[r.key];
  return t(key, {v: r.value});
}
const list = (items) => items.join(lang === "ja" ? "、" : ", ");

const TABS = [
  ["start", "start"],
  ["hotspots", "hotspots"],
  ["markers", "markers"],
  ["untested", "untested"],
  ["functions", "functions"],
  ["large", "large"],
  ["dup", "dup"],
  ["deps", "deps"],
  ["deprecated", "deprecated"],
  ["tools", "tools"],
];
// A measure that did not run gives null, which the band shows as not measured, never as 0.
const ranTools = () => D.deprecated_calls.tools.filter(s => s.ran).map(s => s.tool);
const CARDS = [
  ["start", "cStart", () => D.ranked.length],
  ["hotspots", "cHot", () => D.git ? D.hotspots.length : null],
  ["markers", "cMarkers", () => D.markers.length],
  ["untested", "cUntested", () => D.untested.length],
  ["functions", "cFunctions", () => D.functions.length],
  ["large", "cLarge", () => D.large_files.length],
  ["dup", "cDup", () => D.duplication.reduce((a, b) => a + b.lines, 0)],
  ["deps", "cDeps", () => D.unused_dependencies ? D.unused_dependencies.items.length : null],
  ["deprecated", "cDeprecated", () => ranTools().length ? D.deprecated_calls.items.length : null],
];
// How each value was measured, in the order of the band, with the reason when it was not measured.
const HOW = [
  ["start", () => t("howStart")],
  ["hotspots", () => D.git ? t("howHot", {months: D.months}) : t("howHotNone")],
  ["markers", () => t("howMarkers")],
  ["untested", () => t("howUntested")],
  ["functions", () => t("howFunctions", {n: D.thresholds.long_function})
    + (D.unmeasured_languages.length ? " " + t("howFunctionsNone", {langs: list(D.unmeasured_languages)}) : "")],
  ["large", () => t("howLarge", {n: D.thresholds.large_file})],
  ["dup", () => t("howDup", {n: D.thresholds.duplicate_lines})],
  ["deps", () => !D.unused_dependencies ? t("howDepsNone") : t(D.unused_dependencies.source === "knip" ? "howDepsKnip" : "howDepsSearch")],
  ["deprecated", () => ranTools().length ? t("howDeprecated", {tools: list(ranTools())}) : t("howDeprecatedNone")],
];
const TOOL_ORDER = ["knip", "ruff", "semgrep", "eslint"];
const TOOL_USE = {knip: "useKnip", ruff: "useRuff", semgrep: "useSemgrep", eslint: "useEslint"};

function pagerNav(total, cur, go, id) {
  if (total < 2) return null;
  const nav = el("nav", {class: "pager", "aria-label": t("pages"), ...(id ? {id} : {})});
  nav.append(el("button", {type: "button", onclick: () => go(cur - 1), ...(cur === 0 ? {disabled: ""} : {})}, t("prev")));
  for (let i = 0; i < total; i++) {
    if (total > 9 && i > 1 && i < total - 2 && Math.abs(i - cur) > 1) {
      if (i === 2 || i === total - 3) nav.append(el("span", null, "…"));
      continue;
    }
    nav.append(el("button", {type: "button", "aria-label": t("page", {n: i + 1}), onclick: () => go(i),
      ...(i === cur ? {"aria-current": "page"} : {})}, i + 1));
  }
  nav.append(el("button", {type: "button", onclick: () => go(cur + 1), ...(cur === total - 1 ? {disabled: ""} : {})}, t("next")));
  return nav;
}
function paged(id, rows, head, row) {
  if (!rows.length) return el("div", {class: "empty"}, t("nothing"));
  const total = Math.ceil(rows.length / PAGE);
  const cur = Math.min(pages[id] || 0, total - 1);
  const go = (p) => { pages[id] = p; render(); };
  const body = rows.slice(cur * PAGE, cur * PAGE + PAGE).map(row);
  const table = el("table", null,
    el("thead", null, el("tr", null, head.map(([k, num]) => el("th", num ? {class: "num"} : null, t(k))))),
    el("tbody", null, body));
  return el("div", null, pagerNav(total, cur, go), el("div", {class: "tablewrap"}, table), pagerNav(total, cur, go));
}
const td = (v, num) => el("td", num ? {class: "num"} : null, v);
const tdc = (v) => el("td", null, el("code", null, v));
// The words a tool wrote are quoted in code, letter for letter, apart from the words of the page.
const said = (v) => el("code", {class: "said"}, v);
const tds = (v) => el("td", null, said(v));
// techdebt.py gives a tool that stopped the reason "TOOL stopped with exit code N: FIRST LINE".
// The exit code stays in the words of the page and the first line is quoted under it, without the colon.
function toolState(tool, found) {
  if (tool.ran) return [t("ran", {n: found})];
  const m = /^(\S+ stopped with exit code -?\d+): ([\s\S]+)$/.exec(tool.reason);
  return m ? [t("notRun", {r: m[1]}), said(m[2])] : [t("notRun", {r: tool.reason})];
}
const pathParts = (file) => {
  const at = file.lastIndexOf("/") + 1;
  return [el("span", {class: "dir"}, file.slice(0, at)), el("b", null, file.slice(at))];
};
// A score with two decimals as the summary of scan prints it, where Python rounds an exact half to even.
const two = (x) => {
  const k = x * 100, f = Math.floor(k);
  return k - f === 0.5 ? ((f % 2 ? f + 1 : f) / 100).toFixed(2) : x.toFixed(2);
};
// The score of a row as its number, with a bar under it that shows the same number.
const scoreOf = (score) => el("span", {class: "value"}, el("span", {class: "score"}, two(score)),
  el("span", {class: "bar", "aria-hidden": "true"}, el("i", {style: `width:${Math.min(100, score * 100).toFixed(1)}%`})));

function hotChart() {
  const rows = D.hotspots.slice(0, 15);
  if (!rows.length) return null;
  const W = 760, rowH = 26, left = 300, H = rows.length * rowH + 10;
  const maxC = Math.max(...rows.map(r => r.changes)), maxL = Math.max(...rows.map(r => r.lines));
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  const mk = (tag, a, txt) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.append(e); return e; };
  const span = W - left - 70;
  rows.forEach((r, i) => {
    const y = i * rowH + 4;
    const name = r.file.length > 42 ? "…" + r.file.slice(-41) : r.file;
    mk("text", {x: left - 8, y: y + 12, "text-anchor": "end", class: "lbl"}, name);
    mk("rect", {x: left, y: y, width: Math.max(2, span * r.changes / maxC), height: 9, rx: 2, fill: "var(--bar)"});
    mk("rect", {x: left, y: y + 11, width: Math.max(2, span * r.lines / maxL), height: 9, rx: 2, fill: "var(--bar2)"});
    mk("text", {x: left + span * r.changes / maxC + 6, y: y + 9}, r.changes);
    mk("text", {x: left + span * r.lines / maxL + 6, y: y + 20, class: "lbl"}, r.lines);
  });
  return el("div", {class: "chart"}, svg,
    el("div", {class: "legend"},
      el("span", null, el("i", {style: "background:var(--bar)"}), t("chartChanges")),
      el("span", null, el("i", {style: "background:var(--bar2)"}), t("chartLines"))));
}

// The details of one ranked row: its file, the measures behind its score, and the agent's notes.
function detail(i) {
  const r = D.ranked[i];
  const box = el("section", {class: "detail", id: "detail", "aria-live": "polite"});
  if (!r) return box;
  const n = NOTES[r.file];
  const rows = [["score", el("span", {class: "score"}, two(r.score))]];
  if (n) rows.push(["what", n.what], ["why", n.why], ["action", n.action]);
  box.append(
    el("div", {class: "detail-head"}, el("span", {class: "no"}, i + 1), el("h2", {class: "file"}, pathParts(r.file))),
    el("div", {class: "chips"}, r.reasons.map(x => el("span", {class: "chip"}, reason(x)))),
    el("table", {class: "kv"}, el("tbody", null, rows.map(([k, v]) => el("tr", null, el("th", null, t(k)), el("td", null, v))))));
  return box;
}
function choose(i) {
  pick = i;
  for (const b of document.querySelectorAll("#rows [data-pick]")) b.setAttribute("aria-pressed", String(Number(b.dataset.pick) === i));
  const next = detail(i);
  document.getElementById("detail").replaceWith(next);
  // On a phone the details sit under the list, so the page moves to them.
  if (window.matchMedia("(max-width: 860px)").matches) {
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    next.scrollIntoView({block: "start", behavior: still ? "auto" : "smooth"});
  }
}

const PANELS = {
  start() {
    const box = el("div", null, el("p", {class: "lead"}, t("leadStart")));
    if (!D.ranked.length) return box.appendChild(el("div", {class: "empty"}, t("nothing"))) && box;
    const total = Math.ceil(D.ranked.length / PAGE);
    const cur = Math.min(pages.start || 0, total - 1);
    const from = cur * PAGE;
    if (pick < from || pick >= Math.min(from + PAGE, D.ranked.length)) pick = from;
    const go = (p) => { pages.start = p; pick = p * PAGE; render(); };
    const rows = el("div", {class: "rows", id: "rows"},
      el("div", {class: "rows-head", "aria-hidden": "true"},
        el("span", null, t("rankHead")), el("span", null, t("file")), el("span", {class: "num"}, t("score"))),
      D.ranked.slice(from, from + PAGE).map((r, k) => {
        const i = from + k, n = NOTES[r.file];
        return el("button", {type: "button", class: "row", "data-pick": i, "aria-pressed": String(i === pick), onclick: () => choose(i)},
          el("span", {class: "no"}, i + 1),
          el("span", {class: "name"}, el("span", {class: "file"}, pathParts(r.file)), n ? el("small", null, n.what) : null),
          scoreOf(r.score));
      }));
    box.append(el("div", {class: "split"},
      el("div", {class: "list"}, pagerNav(total, cur, go, "pager-top"), rows, pagerNav(total, cur, go, "pager-bottom")),
      detail(pick)));
    return box;
  },
  hotspots() {
    if (!D.git) return el("div", null, el("p", {class: "lead"}, t("leadHot", {months: D.months})), el("div", {class: "empty"}, t("hotNotGit")));
    return el("div", null, el("p", {class: "lead"}, t("leadHot", {months: D.months})), hotChart(),
      paged("hot", D.hotspots, [["file"], ["changes", 1], ["lines", 1], ["product", 1]],
        r => el("tr", null, tdc(r.file), td(r.changes, 1), td(r.lines, 1), td(r.changes * r.lines, 1))));
  },
  markers() {
    return el("div", null, el("p", {class: "lead"}, t("leadMarkers")),
      paged("markers", D.markers, [["file"], ["kind"], ["age", 1], ["text"]],
        m => el("tr", null, tdc(m.file + ":" + m.line), td(m.kind), td(age(m.age_days), 1), tdc(m.text))));
  },
  untested() {
    return el("div", null, el("p", {class: "lead"}, t("leadUntested")),
      paged("untested", D.untested, [["file"], ["changes", 1], ["lines", 1]],
        r => el("tr", null, tdc(r.file), td(r.changes, 1), td(r.lines, 1))));
  },
  functions() {
    return el("div", null, el("p", {class: "lead"}, t("leadFunctions", {n: D.thresholds.long_function})),
      paged("functions", D.functions, [["file"], ["fn"], ["range", 1], ["length", 1], ["complexity", 1], ["measure"]],
        f => el("tr", null, tdc(f.file), tdc(f.name), td(f.start + "–" + f.end, 1), td(f.lines, 1), td(f.complexity, 1), td(t(f.exact ? "exact" : "approx")))));
  },
  large() {
    return el("div", null, el("p", {class: "lead"}, t("leadLarge", {n: D.thresholds.large_file})),
      paged("large", D.large_files, [["file"], ["lines", 1]], f => el("tr", null, tdc(f.file), td(f.lines, 1))));
  },
  dup() {
    return el("div", null, el("p", {class: "lead"}, t("leadDup", {n: D.thresholds.duplicate_lines})),
      paged("dup", D.duplication, [["first"], ["second"], ["lines", 1]],
        d => el("tr", null, tdc(`${d.a}:${d.a_start}–${d.a_end}`), tdc(`${d.b}:${d.b_start}–${d.b_end}`), td(d.lines, 1))));
  },
  deps() {
    const u = D.unused_dependencies;
    if (!u) return el("div", {class: "empty"}, t("noPackage"));
    return el("div", null, el("p", {class: "lead"}, t(u.source === "knip" ? "leadDepsKnip" : "leadDepsSearch")),
      paged("deps", u.items, [["manifest"], ["depName"], ["depKind"]],
        d => el("tr", null, tdc(d.package), tdc(d.name), tdc(d.kind))));
  },
  deprecated() {
    const c = D.deprecated_calls;
    const box = el("div", null, el("p", {class: "lead"}, t("leadDeprecated")),
      el("div", {class: "tablewrap status"}, el("table", null,
        el("thead", null, el("tr", null, el("th", null, t("toolName")), el("th", null, t("result")))),
        el("tbody", null, c.tools.map(s => el("tr", null, tdc(s.tool),
          el("td", null, toolState(s, c.items.filter(i => i.tool === s.tool).length))))))));
    if (!c.tools.some(s => s.ran)) return box.appendChild(el("div", {class: "empty"}, t("noCallTool"))) && box;
    box.append(paged("deprecated", c.items, [["file"], ["toolName"], ["rule"], ["message"]],
      i => el("tr", null, tdc(i.file + (i.line ? ":" + i.line : "")), td(i.tool), tdc(i.rule), tds(i.message))));
    return box;
  },
  tools() {
    const box = el("div", null, el("p", {class: "lead"}, t("leadTools")));
    if (!D.tools.length) return box.appendChild(el("div", {class: "empty"}, t("nothing"))) && box;
    for (const tool of D.tools) {
      const sec = el("section", {class: "tool"}, el("h3", null, tool.tool),
        el("p", {class: "state"}, toolState(tool, tool.findings.length)));
      if (tool.ran) sec.append(paged("tool-" + tool.tool, tool.findings, [["file"], ["rule"], ["message"]],
        f => el("tr", null, tdc(f.file + (f.line ? ":" + f.line : "")), tdc(f.rule), tds(f.message))));
      box.append(sec);
    }
    return box;
  },
};

// The measures and the tools, shown under the tabs on every tab.
function how() {
  const tools = new Map();
  for (const s of D.tools.concat(D.deprecated_calls.tools)) if (!tools.has(s.tool)) tools.set(s.tool, s);
  const rows = [...tools.values()].sort((a, b) => TOOL_ORDER.indexOf(a.tool) - TOOL_ORDER.indexOf(b.tool));
  return [
    el("h2", null, t("howTitle")),
    el("div", {class: "tablewrap"}, el("table", {class: "how-table"},
      el("thead", null, el("tr", null, el("th", null, t("howMeasure")), el("th", null, t("howWay")))),
      el("tbody", null, HOW.map(([id, text]) => el("tr", {"data-measure": id},
        el("td", {class: "measure-name"}, t(id)), el("td", null, text())))))),
    el("h3", null, t("toolsTitle")),
    el("div", {class: "tablewrap"}, el("table", {class: "how-table tools-table"},
      el("thead", null, el("tr", null, el("th", null, t("toolName")), el("th", null, t("toolUse")), el("th", null, t("result")))),
      el("tbody", null, rows.map(s => el("tr", {"data-tool": s.tool}, tdc(s.tool), td(t(TOOL_USE[s.tool] || s.tool)),
        el("td", null, toolState(s, s.findings ? s.findings.length : D.deprecated_calls.items.filter(i => i.tool === s.tool).length))))))),
  ];
}

function render() {
  document.documentElement.lang = lang;
  document.title = t("title", {p: D.project});
  document.getElementById("title").textContent = t("title", {p: D.project});
  // One name and value per fact, as the report page of page-design shows them, never one sentence.
  const at = D.generated_at.slice(0, 16).replace("T", " ");
  const facts = D.git
    ? [["factCommit", D.head], ["factBranch", D.branch], ["factFiles", D.files], ["factCommits", D.commits], ["factGenerated", at]]
    : [["factGit", t("notGit")], ["factFiles", D.files], ["factGenerated", at]];
  document.getElementById("facts").replaceChildren(...facts.map(([k, v]) =>
    el("div", null, el("dt", null, t(k, {months: D.months})), el("dd", null, v))));
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  for (const b of document.querySelectorAll("[data-theme-choice]")) b.textContent = t(b.dataset.themeChoice);
  document.getElementById("lang-group").setAttribute("aria-label", t("langGroup"));
  document.getElementById("theme-group").setAttribute("aria-label", t("themeGroup"));
  const cards = document.getElementById("cards");
  cards.replaceChildren(...CARDS.map(([id, key, n]) => {
    const v = n();
    const approx = id === "deps" && v !== null && D.unused_dependencies.source === "search";
    return el("button", {type: "button", class: "card", "data-measure": id, onclick: () => show(id)},
      v === null ? el("span", {class: "n none"}, t("notMeasured")) : el("span", {class: "n"}, v),
      el("span", {class: "l"}, t(key)),
      approx ? el("span", {class: "sub"}, t("approxByName")) : null);
  }));
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...TABS.map(([id, key]) => el("button", {type: "button", role: "tab", "aria-selected": String(id === tab),
    onclick: () => show(id)}, t(key))));
  document.getElementById("panel").replaceChildren(PANELS[tab]());
  document.getElementById("how").replaceChildren(...how());
}
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("techdebt-lang", lang); } catch (e) {}
  render();
});
for (const b of document.querySelectorAll("[data-theme-choice]")) b.addEventListener("click", () => {
  setTheme(b.dataset.themeChoice);
  try { localStorage.setItem("techdebt-theme", theme); } catch (e) {}
});
if (PANELS[location.hash.slice(1)]) tab = location.hash.slice(1);
setTheme(theme);
render();
</script>
