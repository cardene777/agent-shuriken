# A question about the status of an EIP belongs to evm-standards, not to the skill that writes code.
schema_version: "1.1"
name: code-unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Is EIP-7702 live on Ethereum mainnet? Answer in one sentence.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'solidity-code'
    min: 0
    max: 0
    arm: both
  - name: no-scan-run
    type: tool_used
    tool: Bash
    input_match: 'solidity-code\.py'
    min: 0
    max: 0
    arm: both
