# A question about the status of a regulated-token ERC is near the financial-standards skill but
# belongs to evm-standards, so the design skill must not start.
schema_version: "1.1"
name: standards-unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Is ERC-3643 a final ERC? Answer in one sentence.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'financial-standards'
    min: 0
    max: 0
    arm: both
  - name: no-script-run
    type: tool_used
    tool: Bash
    input_match: 'financial-standards\.py'
    min: 0
    max: 0
    arm: both
