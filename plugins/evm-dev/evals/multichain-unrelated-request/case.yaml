# A question about which chain ID an existing deployment script requires is near the
# multichain-design skill but asks for no design, so the design skill must not start.
schema_version: "1.1"
name: multichain-unrelated-request
plugins: ["../..", "../../../doc-formats"]
execution:
  prompt: |
    In script/Deploy.s.sol, which chain ID does the script require? Answer in one sentence.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'multichain-design'
    min: 0
    max: 0
    arm: both
  - name: no-script-run
    type: tool_used
    tool: Bash
    input_match: 'multichain-design\.py'
    min: 0
    max: 0
    arm: both
