# A request to test the vault's constructor is near the contract-deploy skill (the same project, the
# same contract) but deploys nothing, so the skill must not start.
schema_version: "1.1"
name: deploy-unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Add a Foundry test in test/Vault.t.sol that checks the constructor stores the owner and the asset, and reverts with ZeroAddress when the owner is the zero address.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'contract-deploy'
    min: 0
    max: 0
    arm: both
  - name: no-script-run
    type: tool_used
    tool: Bash
    input_match: 'contract-deploy\.py'
    min: 0
    max: 0
    arm: both
