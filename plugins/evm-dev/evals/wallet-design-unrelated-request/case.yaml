# A question about which chain an existing frontend file switches to is near the wallet-design skill
# but asks for no design, so the design skill must not start.
schema_version: "1.1"
name: wallet-design-unrelated-request
plugins: ["../..", "../../../doc-formats"]
execution:
  prompt: |
    In src/wallet.ts, which chain does connectWallet switch the wallet to? Answer in one sentence.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'wallet-design'
    min: 0
    max: 0
    arm: both
  - name: no-script-run
    type: tool_used
    tool: Bash
    input_match: 'wallet-design\.py'
    min: 0
    max: 0
    arm: both
