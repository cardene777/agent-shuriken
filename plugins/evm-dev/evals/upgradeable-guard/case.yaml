# OpenZeppelin Contracts 5.5.0 stopped shipping ReentrancyGuardUpgradeable and
# ReentrancyGuardTransientUpgradeable in @openzeppelin/contracts-upgradeable; upgradeable contracts
# import ReentrancyGuard or ReentrancyGuardTransient from @openzeppelin/contracts instead.
# The Hardhat project has 5.5.0 installed under node_modules.
schema_version: "1.1"
name: upgradeable-guard
plugins: ["../.."]
execution:
  prompt: |
    Make contracts/Vault.sol in this Hardhat project upgradeable with UUPS, keeping the owner, and guard withdraw against reentrancy.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'solidity-code'
    arm: with-only
  - name: uses-uups
    type: regex
    target: {source: file, path: contracts/Vault.sol}
    pattern: 'UUPSUpgradeable'
  - name: guard-from-contracts
    type: regex
    target: {source: file, path: contracts/Vault.sol}
    pattern: '@openzeppelin/contracts/utils/ReentrancyGuard(Transient)?\.sol'
  - name: no-removed-upgradeable-guard
    type: regex
    target: {source: file, path: contracts/Vault.sol}
    pattern: 'ReentrancyGuard(Transient)?Upgradeable'
    match: not_contains
