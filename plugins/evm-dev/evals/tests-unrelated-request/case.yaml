# A request to change a contract's event is near the contract-tests skill but asks for no tests,
# so the skill must not start.
schema_version: "1.1"
name: tests-unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    In src/Vault.sol, give the Withdrawn event a second amount, the account's balance left after the withdrawal, and emit it.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'contract-tests'
    min: 0
    max: 0
    arm: both
  - name: no-script-run
    type: tool_used
    tool: Bash
    input_match: 'contract-tests\.py'
    min: 0
    max: 0
    arm: both
