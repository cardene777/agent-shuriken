# OpenZeppelin Contracts 5.7.0 dropped the draft- prefix from ERC4337Utils and IERC4337, after the
# model's training data. The project has 5.7.0 installed, so an import of a draft- path fails to build.
schema_version: "1.1"
name: erc4337-imports
plugins: ["../.."]
execution:
  prompt: |
    In this Foundry project, add src/UserOpInspector.sol: a contract with a view function that takes a packed ERC-4337 user operation and returns the paymaster address it names. Use OpenZeppelin's ERC-4337 helpers rather than parsing the bytes yourself.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'solidity-code'
    arm: with-only
  - name: uses-the-helpers
    type: regex
    target: {source: file, path: src/UserOpInspector.sol}
    pattern: 'ERC4337Utils'
  - name: imports-current-paths
    type: regex
    target: {source: file, path: src/UserOpInspector.sol}
    pattern: 'draft-'
    match: not_contains
