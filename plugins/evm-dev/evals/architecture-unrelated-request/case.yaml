# A question about one modifier in a marketplace contract is near the dapp-architecture skill but
# asks for no design, so the design skill must not start.
schema_version: "1.1"
name: architecture-unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    In contracts/Market.sol, what does the whenNotPaused modifier do, and who can turn it on? Answer in two sentences.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'dapp-architecture'
    min: 0
    max: 0
    arm: both
  - name: no-script-run
    type: tool_used
    tool: Bash
    input_match: 'dapp-architecture\.py'
    min: 0
    max: 0
    arm: both
