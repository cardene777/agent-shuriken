# From OpenZeppelin Contracts 5.6.0, ERC1967Proxy reverts with ERC1967ProxyUninitialized when it is
# deployed with empty data, so a factory must pass the initialize call to the proxy's constructor.
schema_version: "1.1"
name: proxy-init-data
plugins: ["../.."]
execution:
  prompt: |
    Add src/VaultFactory.sol to this Foundry project: a factory that keeps one Vault implementation and has a function that deploys a new Vault for a given owner behind an ERC1967Proxy and returns the proxy's address.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'solidity-code'
    arm: with-only
  - name: deploys-a-proxy
    type: regex
    target: {source: file, path: src/VaultFactory.sol}
    pattern: 'new\s+ERC1967Proxy\s*[({]'
  - name: passes-initialize-to-the-proxy
    type: regex
    target: {source: file, path: src/VaultFactory.sol}
    pattern: 'ERC1967Proxy\s*(\{[^}]*\}\s*)?\([^;]*abi\.encode(Call|WithSelector|WithSignature)\s*\('
  - name: no-empty-init-data
    type: regex
    target: {source: file, path: src/VaultFactory.sol}
    pattern: 'ERC1967Proxy\s*(\{[^}]*\}\s*)?\([^;]*,\s*(""|''''|new\s+bytes\(0\)|bytes\(""\)|hex"")\s*\)'
    match: not_contains
