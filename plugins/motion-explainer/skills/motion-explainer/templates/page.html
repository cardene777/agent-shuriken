<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
/* The page around the video reads in light and dark. The video keeps the colors of its theme in both,
   since its pictures are drawn on that background. */
:root {
  color-scheme: light;
  --bg: #f5f4f1; --surface: #ffffff; --ink: #17161a; --sub: #57555e; --line: #e3e1dc; --label: #efede8;
  --accent: #2f5bd3; --accent-soft: #e6ecfb;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131316; --surface: #1c1c21; --ink: #ecebef; --sub: #b4b2bc; --line: #2f2e35; --label: #26262c;
    --accent: #8aa6ff; --accent-soft: #232b45;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131316; --surface: #1c1c21; --ink: #ecebef; --sub: #b4b2bc; --line: #2f2e35; --label: #26262c;
  --accent: #8aa6ff; --accent-soft: #232b45;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 var(--sans); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* The effects core draws on a canvas over the page; keep it inside the window so the page never scrolls sideways. */
html canvas.sakuga-fx { width: 100%; height: 100%; }

.me { max-width: 1080px; margin: 0 auto; padding: 32px 24px 72px; }
.me-top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 14px 24px; margin-bottom: 20px; }
.me-heading { flex: 1 1 460px; min-width: 0; }
.me-title { margin: 0; font-size: clamp(24px, 3.2vw, 32px); line-height: 1.3; font-weight: 800; }
.me-lead { margin: 8px 0 0; max-width: 64ch; color: var(--sub); font-size: 16.5px; line-height: 1.75; }
.me-lead:empty { display: none; }
.me-seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.me-seg button { padding: 5px 12px; border: 0; border-radius: 7px; background: transparent; color: var(--sub); font-size: 13px; font-weight: 700; cursor: pointer; }
.me-seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.me-player { display: grid; gap: 12px; }
.me-player > .mx { width: 100%; box-shadow: 0 1px 2px rgba(20, 18, 15, .06), 0 18px 40px -26px rgba(20, 18, 15, .4); }
.me-under { display: flex; align-items: center; gap: 14px; }
.me-btn { flex: none; min-width: 96px; padding: 9px 18px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 800; cursor: pointer; }
/* The line being spoken, under the video, for a screen too narrow to read the bubble. */
.me-line { display: none; margin: 0; min-height: 1.6em; font-size: 16px; font-weight: 700; line-height: 1.55; }
.me-line b { margin-right: 8px; color: var(--sub); font-size: 13px; }

.me-figures { display: grid; gap: 20px; margin-top: 40px; }
.me-figures:empty { display: none; }
.me-fig { margin: 0; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.me-q { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.45; }
.me-a { margin: 6px 0 18px; color: var(--sub); }
.me-still { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: center; gap: 22px; }
.me-mini { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; }
.me-mini > .mx { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; }
.me-legend { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.me-legend li { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: start; gap: 12px; font-weight: 700; }
.me-badge { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 800; line-height: 1; }
.me-flow { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 34px; margin: 0; padding: 0; list-style: none; }
.me-step { position: relative; display: grid; gap: 10px; align-content: start; }
.me-step:not(:last-child)::after { content: ""; position: absolute; top: 46px; right: -24px; width: 12px; height: 12px; border-top: 3px solid var(--sub); border-right: 3px solid var(--sub); transform: rotate(45deg); }
.me-step p { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; font-weight: 700; line-height: 1.5; }
.me-sn { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--label); color: var(--sub); font-size: 12px; font-weight: 800; }
.me-chip { height: 104px; padding: 10px; border-radius: 12px; background: var(--label); display: grid; place-items: center; overflow: hidden; }
.me-chip img { max-width: 100%; max-height: 100%; object-fit: contain; }
.me-chip img.top { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 6px; }
.me-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.me-side { display: grid; gap: 12px; align-content: start; padding: 16px; border-radius: 12px; background: var(--label); }
.me-side h4 { margin: 0; font-size: 16px; font-weight: 800; }
.me-side .me-chip { height: 140px; background: var(--surface); }
.me-side ul { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.me-side li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.me-side li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); transform: translateY(-1px); }
.me-table { overflow-x: auto; }
.me-table table { width: 100%; border-collapse: collapse; font-size: 15px; }
.me-table th, .me-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.me-table th { background: var(--label); font-size: 13.5px; color: var(--sub); }

{{engine_css}}

@media (max-width: 720px) {
  .me { padding: 20px 16px 56px; }
  .me-player > .mx { border-radius: 12px; }
  .me-line { display: block; }
  .me-under { align-items: flex-start; }
  .me-fig { padding: 18px 16px; }
  .me-still { grid-template-columns: minmax(0, 1fr); }
  .me-flow { grid-template-columns: minmax(0, 1fr); gap: 30px; }
  .me-step:not(:last-child)::after { top: auto; right: auto; bottom: -22px; left: 50%; transform: translateX(-50%) rotate(135deg); }
  .me-compare { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  :root { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .me-under, .me-seg { display: none; }
  .me-fig { break-inside: avoid; }
}
</style>
</head>
<body>
<main class="me">
  <header class="me-top">
    <div class="me-heading">
      <h1 class="me-title">{{title}}</h1>
      <p class="me-lead">{{lead}}</p>
    </div>
    <div class="me-seg" role="group" aria-label="{{ui_theme}}"><button type="button" data-theme-choice="light">{{ui_light}}</button><button type="button" data-theme-choice="dark">{{ui_dark}}</button></div>
  </header>
  <section id="me-player" class="me-player" aria-label="{{ui_player}}">
    <div class="mx" data-paused></div>
    <div class="me-under">
      <button type="button" id="me-play" class="me-btn" aria-pressed="false">{{ui_play}}</button>
      <p id="me-line" class="me-line" aria-live="polite"></p>
    </div>
  </section>
  <section id="me-figures" class="me-figures" aria-label="{{ui_figures}}"></section>
</main>
<!-- The effects core of Sakuga VFX (MIT), bundled unmodified; see vendor/sakuga-vfx of the skill. -->
<script>
{{fx_core}}
</script>
<script>
window.MX_THEME = {{theme}};
window.MX_SCRIPT = {{script}};
window.MX_UI = {{ui}};
</script>
<script>
{{engine_js}}
</script>
<script>
(() => {
  const root = document.documentElement;
  const read = () => { try { return localStorage.getItem('me-theme'); } catch (e) { return null; } };
  const store = v => { try { localStorage.setItem('me-theme', v); } catch (e) { /* storage may be blocked */ } };
  const set = t => {
    if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
    const now = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.querySelectorAll('[data-theme-choice]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeChoice === now)));
  };
  document.querySelectorAll('[data-theme-choice]').forEach(b => b.addEventListener('click', () => { store(b.dataset.themeChoice); set(b.dataset.themeChoice); }));
  set(read());
})();
</script>
</body>
</html>
