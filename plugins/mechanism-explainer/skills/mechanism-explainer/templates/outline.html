<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{page_title}}</title>
<style>
/* The outline page of mechanism-explainer. Every value comes from references/outline-design.md, which names
   its source. The page has a light color scheme only. */
:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --text: #1f1f1f;
  --sub: #555555;
  --line: #d6d6d1;
  --hover: #efefeb;
  --panel: #f6f6f3;
  --code: #e9e9e4;
  --focus: #1a56db;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
/* Japanese lines break between phrases, keep the strict line-break rules, and get a little more room. */
html:lang(ja) body {
  font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  line-height: 1.75;
  letter-spacing: .02em;
  word-break: auto-phrase;
  line-break: strict;
}
code {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: .875em;
  background: var(--code);
  border-radius: 4px;
  padding: 1px 5px;
  letter-spacing: 0;
}
main { max-width: 800px; margin: 0 auto; padding: 48px 24px 96px; }
h1 { font-size: 32px; line-height: 1.35; margin: 0 0 16px; }
.lead { font-size: 18px; max-width: 40em; margin: 0 0 24px; }
.overview { margin: 0 0 40px; }
.overview .secs { background: var(--surface); border: 1px solid var(--line); }
/* A section is its heading with its point under it, on a tinted panel, with a line between two sections. */
.secs { margin: 0; background: var(--panel); border-radius: 8px; padding: 4px 18px; }
.sec { padding: 12px 0; }
.sec + .sec { border-top: 1px solid var(--line); }
.secs dt { font-weight: 700; line-height: 1.5; margin: 0; }
.secs dd { margin: 4px 0 0; max-width: 40em; }
.toolbar { margin: 0 0 12px; }
.toolbar button {
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  min-height: 44px;
  padding: 0 16px;
  cursor: pointer;
}
.toolbar button:hover { background: var(--hover); }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
/* A chapter row is one button across its whole width: an icon on the left, a white surface, a border, and
   text in the body color instead of link blue. */
.chapter { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; }
.chapter > summary {
  list-style: none;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  padding: 18px 20px;
  min-height: 64px;
  cursor: pointer;
  border-radius: 10px;
}
.chapter > summary::-webkit-details-marker { display: none; }
.chapter > summary:hover { background: var(--hover); }
.chapter[open] > summary { border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; }
.icon { flex: none; width: 28px; height: 28px; margin-top: 2px; border: 1.5px solid var(--text); border-radius: 50%; position: relative; }
.icon::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  border-right: 2px solid var(--text);
  border-bottom: 2px solid var(--text);
  transform: translate(-50%, -70%) rotate(45deg);
  transition: transform .15s;
}
.chapter[open] .icon::before { transform: translate(-50%, -30%) rotate(-135deg); }
.head { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.head h2 { font-size: 24px; line-height: 1.4; margin: 0; }
.sub { color: var(--sub); }
.body { padding: 4px 24px 16px 64px; }
.page { padding: 22px 0 24px; }
.page + .page { border-top: 1px solid var(--line); }
.page h3 { font-size: 20px; line-height: 1.45; margin: 0 0 6px; }
.point { max-width: 40em; margin: 0 0 16px; }
@media (max-width: 640px) {
  main { padding: 28px 16px 64px; }
  h1 { font-size: 26px; }
  .lead { font-size: 17px; }
  .chapter > summary { padding: 16px; }
  .head h2 { font-size: 21px; }
  .body { padding: 4px 16px 8px; }
  .secs { padding: 2px 14px; }
}
@media print {
  body { background: #fff; }
  .toolbar { display: none; }
}
</style>
</head>
<body>
<main>
<h1>{{title}}</h1>
<p class="lead">{{point}}</p>
{{overview}}
<div class="toolbar"><button type="button" id="all">{{open}}</button></div>
{{chapters}}
</main>
<script>
// One button opens and closes every chapter, and its words say what it will do next.
const TEXT = {{text}};
const all = document.getElementById("all");
const chapters = [...document.querySelectorAll("details.chapter")];
const sync = () => { all.textContent = chapters.every((d) => d.open) ? TEXT.close : TEXT.open; };
all.addEventListener("click", () => {
  const open = !chapters.every((d) => d.open);
  chapters.forEach((d) => { d.open = open; });
  sync();
});
chapters.forEach((d) => d.addEventListener("toggle", sync));
// A printed outline shows every chapter.
window.addEventListener("beforeprint", () => chapters.forEach((d) => { d.open = true; }));
</script>
</body>
</html>
