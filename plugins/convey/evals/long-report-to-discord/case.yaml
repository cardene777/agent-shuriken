# A weekly report longer than a Discord message becomes one message within 2,000 characters that keeps the
# numbers and the deadline, with no table and none of the report's filler phrases.
schema_version: "1.1"
name: long-report-to-discord
plugins: ["../.."]
execution:
  prompt: |
    report.md is my weekly report on the login migration. Write a message that shares it with the team in our Discord channel, and save the message to message.md.
  max_turns: 16
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'convey'
    arm: with-only
  - name: within-discord-limit
    type: regex
    target: {source: file, path: message.md}
    pattern: '^[\s\S]{1,2000}$'
  - name: concise
    type: regex
    target: {source: file, path: message.md}
    pattern: '^[\s\S]{1,1200}$'
  - name: numbers-kept
    type: regex
    target: {source: file, path: message.md}
    pattern: '(?=[\s\S]*0\.8 ?%)(?=[\s\S]*310 ?ms)(?=[\s\S]*(11月28日|11/28))'
  - name: no-table
    type: regex
    target: {source: file, path: message.md}
    pattern: '(^|\n) *\|.*\|'
    match: not_contains
  - name: no-filler
    type: regex
    target: {source: file, path: message.md}
    pattern: '以下の通り|以下のとおり|させていただきます|ご不明な点|お気軽に|参考になれば'
    match: not_contains
