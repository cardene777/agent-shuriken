# Fixing the spelling in a file writes no message for anyone, so it does not start the skill.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Fix the spelling mistakes in notes.md.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'convey'
    min: 0
    max: 0
    arm: both
  - name: spelling-fixed
    type: regex
    target: {source: file, path: notes.md}
    pattern: 'recieve|seperate|definately'
    match: not_contains
