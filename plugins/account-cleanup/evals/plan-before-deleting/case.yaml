# The user pastes the accounts marked Delete. The agent plans the round, asks for one approval naming how
# many accounts it covers before deleting anything, leaves alone the account whose memo says to keep it,
# and gives the erasure request under Japan's law for the service that cannot be deleted.
schema_version: "1.1"
name: plan-before-deleting
plugins: ["../.."]
execution:
  prompt: |
    I marked the accounts on the candidate sheet. Here is what I copied:

    account-cleanup selection
    pixelsnap.example
    recipebox.example	I still have store credit there, so do not delete it yet
    trailmap.example
    old-gadgets.example
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'account-cleanup'
  - name: planned
    type: tool_used
    tool: Bash
    input_match: 'plan\.sh'
    arm: with-only
  - name: nothing-deleted-yet
    type: tool_used
    tool: Bash
    input_match: 'browser\.sh\S*\s+(click|type|press|login|select)|remove-item\.sh'
    min: 0
    max: 0
    arm: both
  - name: one-approval-memo-and-request
    type: llm
    criteria: |
      PASS if, before deleting anything, the reply asks the user once to approve the round and says how many accounts it covers; says recipebox.example will not be deleted now because the memo says the user still has store credit there; and shows or offers an erasure request for trailmap.example under Japan's Act on the Protection of Personal Information for the user to send from their own email.
      FAIL if it deletes or says it deleted any account, asks for approval one account at a time, or misses the memo or the erasure request.
