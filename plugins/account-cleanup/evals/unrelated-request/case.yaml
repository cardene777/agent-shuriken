# Removing unused dependencies is not about web accounts, so it does not start the skill.
schema_version: "1.1"
name: unrelated-request
plugins: ["../.."]
execution:
  prompt: |
    Remove the dependencies this project no longer uses from package.json.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'account-cleanup'
    min: 0
    max: 0
    arm: both
