<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer</title>
<!--
  page-design document: the whole picture first, sections in reading order with a contents list
  beside them, steps with real output, and one glossary that every use links to. A following skill
  replaces DATA and the words in TEXT, and keeps the frame.
  The figures are still dragon blocks kept in #figures and moved into the article; a following skill
  replaces their notation and runs dragon embed before handing the page over.
-->
<script type="module" src="https://cdn.jsdelivr.net/npm/@cardenelabs/dragon@0.80/dist/cdn/dragon.js"></script>
<style>
:root {
  --bg: #ffffff; --side: #f6f7f9; --surface: #ffffff; --ink: #1b2129; --sub: #4d5664; --line: #dfe3e8;
  --accent: #2a5bd7; --accent-ink: #ffffff; --accent-soft: #e8eefc; --code: #f3f5f8; --label: #eef1f5;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --text-size: 16px; --line-height: 1.8; --page-width: 820px; --radius-small: 8px; --radius: 10px; --radius-large: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --side: #191d23; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
    --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --code: #20252d; --label: #222831; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --side: #191d23; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
  --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --code: #20252d; --label: #222831; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--text-size)/var(--line-height) var(--sans); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 19px; line-height: 1.35; }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-small); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.icon { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; font-weight: 700; }

.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
aside.side { background: var(--side); border-right: 1px solid var(--line); }
nav.toc { position: sticky; top: 57px; max-height: calc(100vh - 57px); overflow-y: auto; padding: 22px 14px; }
nav.toc a { display: block; padding: 7px 12px; border-radius: 6px; color: var(--sub); text-decoration: none; font-size: 14px; transition: background-color .15s, color .15s; }
nav.toc a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
article { max-width: var(--page-width); padding: 30px 44px 80px; display: grid; gap: 18px; }
.lead { margin: 0; font-size: 17px; }
.facts-wrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
/* One row per fact: side by side as columns on wide screens, and label and value rows on phones */
.facts { width: 100%; border-collapse: collapse; }
.facts, .facts tbody { display: block; }
.facts tbody { display: grid; grid-auto-flow: column; grid-auto-columns: auto; }
.facts tr { display: grid; grid-template-rows: auto 1fr; border-left: 1px solid var(--line); }
.facts tr:first-child { border-left: 0; }
.facts th, .facts td { padding: 8px 18px; text-align: left; }
.facts th { font-size: 13px; font-weight: 500; color: var(--sub); background: var(--label); border-bottom: 1px solid var(--line); word-break: auto-phrase; }
.facts td { font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 860px) {
  .facts tbody { grid-auto-flow: row; }
  .facts tr { grid-template-columns: 9.5em minmax(0, 1fr); grid-template-rows: auto; border-left: 0; border-top: 1px solid var(--line); }
  .facts tr:first-child { border-top: 0; }
  .facts th, .facts td { padding: 9px 14px; }
  .facts th { border-bottom: 0; }
}
article h2 { margin: 18px 0 0; font-size: 23px; line-height: 1.4; padding-bottom: 6px; border-bottom: 2px solid var(--ink); scroll-margin-top: 70px; }
article p { margin: 0; }
figure { margin: 0; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: zoom-in; --dragon-figure-background: var(--surface); }
figure svg { display: block; width: 100%; height: auto; }
figure pre { margin: 0; white-space: pre-wrap; font: 13px/1.5 var(--mono); color: var(--sub); background: transparent; }
html[lang="en"] [data-figure-lang="ja"], html[lang="ja"] [data-figure-lang="en"] { display: none; }
figcaption { margin-top: 8px; font-size: 14px; color: var(--sub); }
ol.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 12px; }
ol.steps li > span { display: block; }
pre { margin: 6px 0 0; padding: 10px 14px; border-radius: var(--radius-small); background: var(--code); font: 14px/1.6 var(--sans); white-space: pre-wrap; }
dl.glossary { margin: 0; display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 0; border-top: 1px solid var(--line); }
dl.glossary dt, dl.glossary dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); }
dl.glossary dt { font-weight: 600; scroll-margin-top: 70px; }
dl.glossary dt:target { color: var(--accent); }

dialog { width: min(1100px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: var(--radius-large); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.dialog-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 17px; }
.dialog-head .icon { margin-left: auto; }
.dialog-body { padding: 16px 18px 20px; }
.dialog-body svg { display: block; width: 100%; height: auto; }
#zoom-body { --dragon-figure-background: var(--surface); }

@media (max-width: 860px) {
  .cols { grid-template-columns: 1fr; }
  aside.side { border-right: 0; border-bottom: 1px solid var(--line); }
  nav.toc { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; }
  article { padding: 22px 16px 60px; }
  .top-in { padding-left: 16px; padding-right: 16px; }
  dl.glossary { grid-template-columns: 1fr; }
  dl.glossary dt { border-bottom: 0; padding-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 id="title"></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button><button type="button" data-lang="ja">日本語</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" data-t="light"></button><button type="button" data-theme-choice="dark" data-t="dark"></button>
      </div>
      <button type="button" class="icon" id="help-open" aria-label="Help">?</button>
    </div>
  </div>
</header>
<div class="cols">
  <aside class="side"><nav class="toc" id="toc" aria-label="Contents"></nav></aside>
  <article id="doc"></article>
</div>
<!-- The figures, moved into the article where a block names them. -->
<div id="figures" hidden>
  <figure data-figure="steps" tabindex="0" role="button">
    <div data-figure-lang="en"><pre class="dragon" data-still>
cycle From the beans to the cup [shape: band]

box weigh as Weigh the beans
box grind as Grind them
box bloom as Let them bloom
box pour as Pour in three turns
box cup as A cup of coffee

step Weigh
  say Weigh the beans.
step Grind
  say Grind the beans.
  weigh -&gt; grind [carry: none]
step Bloom
  say Let the grounds bloom.
  grind -&gt; bloom [carry: none]
step Pour
  say Pour the rest of the water.
  bloom -&gt; pour [carry: none]
step Serve
  say The coffee is ready.
  pour -&gt; cup [carry: none]
</pre></div>
    <div data-figure-lang="ja"><pre class="dragon" data-still>
cycle 豆からカップまで [shape: band]

box weigh as 豆を量る
box grind as 挽く
box bloom as 蒸らす
box pour as 3回に分けて注ぐ
box cup as 1杯のコーヒー

step 量る
  say 豆を量る。
step 挽く
  say 豆を挽く。
  weigh -&gt; grind [carry: none]
step 蒸らす
  say 粉を蒸らす。
  grind -&gt; bloom [carry: none]
step 注ぐ
  say 残りのお湯を注ぐ。
  bloom -&gt; pour [carry: none]
step できあがり
  say コーヒーができる。
  pour -&gt; cup [carry: none]
</pre></div>
    <figcaption></figcaption>
  </figure>
</div>

<dialog id="help">
  <div class="dialog-head"><h2 data-t="helpTitle"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body"><p data-t="helpBody"></p></div>
</dialog>
<dialog id="zoom">
  <div class="dialog-head"><h2 id="zoom-title"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body" id="zoom-body"></div>
</dialog>

<script>
// One dictionary for every UI string. The explanation itself is in DATA.
const TEXT = {
  en: {
    light: "Light", dark: "Dark", updated: "Updated", brewTime: "Time to brew", makes: "Makes",
    helpTitle: "How to read this page",
    helpBody: "The first section shows every step at once. Each later section explains one step in order. Underlined words open their meaning in the glossary at the end.",
  },
  ja: {
    light: "明るい", dark: "暗い", updated: "直した日", brewTime: "淹れる時間", makes: "できる量",
    helpTitle: "この頁の読み方",
    helpBody: "最初の節で全ての手順を一度に見せます。後の節は手順を1つずつ順に説明します。下線の付いた言葉を押すと、最後の用語集で意味を開きます。",
  },
};

// The explanation. A following skill writes this object. Text may hold links to the glossary as
// [[term-id|shown words]].
const DATA = {
  title: { en: "How to brew pour-over coffee", ja: "ハンドドリップのコーヒーの淹れ方" },
  lead: { en: "Weigh the beans, grind them, and pour hot water in three turns. This page shows the whole flow first, then each step.", ja: "豆を量って挽き、お湯を3回に分けて注ぎます。この頁は先に全体の流れを見せ、そのあと手順を1つずつ説明します。" },
  facts: [["updated", "2026-11-20"], ["brewTime", { en: "4 minutes", ja: "4分" }], ["makes", { en: "1 cup, 250 ml", ja: "1杯、250ml" }]],
  sections: [
    { id: "whole", title: { en: "The whole flow", ja: "全体の流れ" }, blocks: [
      { figure: "steps", caption: { en: "From the beans to the cup. Press the figure to enlarge it.", ja: "豆からカップまでの流れ。図を押すと大きく開きます。" } },
      { p: { en: "Grind the beans to a [[grind|medium grind]], wet them first to let them [[bloom|bloom]], then pour hot water in turns until the cup is full. The [[ratio|ratio]] of beans to water sets the strength.", ja: "豆を[[grind|中挽き]]にし、先に少しのお湯で[[bloom|蒸らして]]から、カップが満ちるまで何回かに分けて注ぎます。豆とお湯の[[ratio|比率]]で濃さが決まります。" } },
    ] },
    { id: "beans", title: { en: "Choosing the beans", ja: "豆を選ぶ" }, blocks: [
      { p: { en: "Use medium roast beans roasted within the last month. Dark roast tastes bitter with this recipe, so use 1 g less of it.", ja: "焙煎から1か月以内の中煎りの豆を使います。深煎りはこの淹れ方だと苦く出るので、1g減らします。" } },
    ] },
    { id: "brew", title: { en: "Brewing a cup", ja: "1杯を淹れる" }, blocks: [
      { steps: [
        { text: { en: "Weigh 15 g of beans and grind them.", ja: "豆を15g量って挽きます。" }, output: { en: "15 g of ground coffee, about as fine as coarse sand", ja: "挽いた粉15g。粗い砂くらいの細かさ" } },
        { text: { en: "Pour 30 ml of water at 90 degrees and wait 30 seconds.", ja: "90度のお湯を30ml注ぎ、30秒待ちます。" }, output: { en: "The grounds swell like a dome and stop bubbling", ja: "粉がドームのように膨らみ、泡が止まる" } },
        { text: { en: "Pour the rest in three turns, up to 250 ml.", ja: "残りを3回に分けて、250mlまで注ぎます。" }, output: { en: "One cup of coffee in about 3 minutes", ja: "約3分で1杯のコーヒー" } },
      ] },
    ] },
    { id: "glossary", title: { en: "Glossary", ja: "用語集" }, blocks: [
      { glossary: [
        { id: "grind", term: { en: "Medium grind", ja: "中挽き" }, meaning: { en: "Beans ground about as fine as coarse sand. Finer grinds taste stronger and more bitter.", ja: "粗い砂くらいの細かさに挽いた豆。細かいほど濃く苦くなります。" } },
        { id: "bloom", term: { en: "Bloom", ja: "蒸らし" }, meaning: { en: "Wetting the grounds with a little water first, so gas escapes and the later water draws out the taste evenly.", ja: "先に少しのお湯で粉を湿らせること。ガスが抜け、後のお湯で味が均一に出ます。" } },
        { id: "ratio", term: { en: "Ratio", ja: "比率" }, meaning: { en: "Grams of beans to milliliters of water. This page uses 15 g to 250 ml.", ja: "豆のグラムとお湯のミリリットルの割合。この頁では15gに250mlです。" } },
      ] },
    ] },
  ],
};

const state = { lang: "en" };
const $ = (id) => document.getElementById(id);
const t = (key) => TEXT[state.lang][key] ?? key;
const pick = (value) => (value && typeof value === "object" && !Array.isArray(value) ? value[state.lang] : value);
// Japanese text starts a new line after each full stop that has more text after it. A full stop right
// before a closing bracket or quote ends a quoted sentence inside a longer one, so it stays.
const lines = (s) => esc(s).replace(/\u3002(?![\u300d\u300f\uff09)\u3011\u3009\u300b]|&quot;|$)/gu, "\u3002<br>");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const linked = (s) => lines(s).replace(/\[\[([\w-]+)\|([^\]]+)\]\]/g, (_, id, words) => `<a href="#g-${id}">${words}</a>`);

function block(b) {
  if (b.p) return `<p>${linked(pick(b.p))}</p>`;
  if (b.figure) return `<div data-figure-slot="${b.figure}" data-caption="${esc(pick(b.caption))}"></div>`;
  if (b.steps) return `<ol class="steps">${b.steps.map((s) => `<li><span>${linked(pick(s.text))}</span>${s.output ? `<pre>${esc(pick(s.output))}</pre>` : ""}</li>`).join("")}</ol>`;
  if (b.glossary) return `<dl class="glossary">${b.glossary.map((g) => `<dt id="g-${g.id}">${lines(pick(g.term))}</dt><dd>${lines(pick(g.meaning))}</dd>`).join("")}</dl>`;
  return "";
}

function render() {
  // Put the figures back before the article is written again, so the drawn figures are kept.
  document.querySelectorAll("#doc figure[data-figure]").forEach((f) => $("figures").appendChild(f));
  document.documentElement.lang = state.lang;
  const title = pick(DATA.title);
  document.title = title;
  $("title").textContent = title;
  document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = lines(t(el.dataset.t)); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("toc").innerHTML = DATA.sections.map((s, i) => `<a href="#${s.id}" aria-current="${i === 0}">${lines(pick(s.title))}</a>`).join("");
  $("doc").innerHTML = `<p class="lead">${lines(pick(DATA.lead))}</p>
    <div class="facts-wrap"><table class="facts" role="table"><tbody role="rowgroup">${DATA.facts.map(([k, v]) => `<tr role="row"><th scope="row" role="rowheader">${lines(t(k))}</th><td role="cell">${lines(pick(v))}</td></tr>`).join("")}</tbody></table></div>` +
    DATA.sections.map((s) => `<h2 id="${s.id}">${lines(pick(s.title))}</h2>${s.blocks.map(block).join("")}`).join("");
  document.querySelectorAll("[data-figure-slot]").forEach((slot) => {
    const figure = $("figures").querySelector(`[data-figure="${slot.dataset.figureSlot}"]`);
    if (!figure) return;
    figure.querySelector("figcaption").textContent = slot.dataset.caption;
    slot.replaceWith(figure);
  });
  watch();
}

let observer;
function watch() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      document.querySelectorAll("nav.toc a").forEach((a) => a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + entry.target.id)));
    });
  }, { rootMargin: "-70px 0px -70% 0px" });
  document.querySelectorAll("article h2").forEach((h) => observer.observe(h));
}

// A figure opens larger in the dialog, in the language the page shows.
function openFigure(figure) {
  const shownFigure = figure.querySelector(`[data-figure-lang="${state.lang}"]`);
  $("zoom-title").textContent = figure.querySelector("figcaption").textContent;
  $("zoom-body").innerHTML = shownFigure ? shownFigure.innerHTML : "";
  $("zoom").showModal();
}

document.addEventListener("keydown", (e) => {
  const figure = e.target.closest && e.target.closest("[data-figure]");
  if (figure && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openFigure(figure); }
});

function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  document.querySelectorAll("[data-theme-choice]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === mode)));
  try { localStorage.setItem("page-design-theme", mode); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const lang = e.target.closest("[data-lang]");
  if (lang) { state.lang = lang.dataset.lang; try { localStorage.setItem("page-design-lang", state.lang); } catch (err) {} render(); return; }
  const theme = e.target.closest("[data-theme-choice]");
  if (theme) { setTheme(theme.dataset.themeChoice); return; }
  if (e.target.closest("#help-open")) { $("help").showModal(); return; }
  const figure = e.target.closest("[data-figure]");
  if (figure) { openFigure(figure); return; }
  if (e.target.closest("[data-close]")) e.target.closest("dialog").close();
});

try { state.lang = localStorage.getItem("page-design-lang") || "en"; } catch (e) {}
let startTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { startTheme = localStorage.getItem("page-design-theme") || startTheme; } catch (e) {}
setTheme(startTheme);
render();
</script>
</body>
</html>
