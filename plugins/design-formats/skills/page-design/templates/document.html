<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer</title>
<!--
  page-design document: the whole picture first, sections in reading order with a contents list
  beside them, steps with real output, and one glossary that every use links to. A following skill
  replaces DATA and the words in TEXT, and keeps the frame.
-->
<style>
:root {
  --bg: #ffffff; --side: #f6f7f9; --surface: #ffffff; --ink: #1b2129; --sub: #4d5664; --line: #dfe3e8;
  --accent: #2a5bd7; --accent-ink: #ffffff; --accent-soft: #e8eefc; --code: #f3f5f8;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --side: #191d23; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
    --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --code: #20252d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --side: #191d23; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
  --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --code: #20252d; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.8 var(--sans); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 19px; line-height: 1.35; }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.icon { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; font-weight: 700; }

.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
aside.side { background: var(--side); border-right: 1px solid var(--line); }
nav.toc { position: sticky; top: 57px; max-height: calc(100vh - 57px); overflow-y: auto; padding: 22px 14px; }
nav.toc a { display: block; padding: 7px 12px; border-radius: 6px; color: var(--sub); text-decoration: none; font-size: 14px; transition: background-color .15s, color .15s; }
nav.toc a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
article { max-width: 820px; padding: 30px 44px 80px; display: grid; gap: 18px; }
.lead { margin: 0; font-size: 17px; }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.facts div { padding: 10px 16px; border-left: 1px solid var(--line); margin-left: -1px; }
.facts dt { font-size: 12.5px; color: var(--sub); }
.facts dd { margin: 0; font-weight: 600; }
article h2 { margin: 18px 0 0; font-size: 23px; line-height: 1.4; padding-bottom: 6px; border-bottom: 2px solid var(--ink); scroll-margin-top: 70px; }
article p { margin: 0; }
figure { margin: 0; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: zoom-in; }
figure svg { display: block; width: 100%; height: auto; }
figcaption { margin-top: 8px; font-size: 14px; color: var(--sub); }
ol.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 12px; }
ol.steps li > span { display: block; }
pre { margin: 6px 0 0; padding: 12px 14px; border-radius: 8px; background: var(--code); font: 13.5px/1.6 var(--mono); overflow-x: auto; }
dl.glossary { margin: 0; display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 0; border-top: 1px solid var(--line); }
dl.glossary dt, dl.glossary dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); }
dl.glossary dt { font-weight: 600; scroll-margin-top: 70px; }
dl.glossary dt:target { color: var(--accent); }

dialog { width: min(1100px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.dialog-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 17px; }
.dialog-head .icon { margin-left: auto; }
.dialog-body { padding: 16px 18px 20px; }
.dialog-body svg { display: block; width: 100%; height: auto; }

@media (max-width: 860px) {
  .cols { grid-template-columns: 1fr; }
  aside.side { border-right: 0; border-bottom: 1px solid var(--line); }
  nav.toc { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; }
  article { padding: 22px 16px 60px; }
  .top-in { padding-left: 16px; padding-right: 16px; }
  dl.glossary { grid-template-columns: 1fr; }
  dl.glossary dt { border-bottom: 0; padding-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 id="title"></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button><button type="button" data-lang="ja">日本語</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" data-t="light"></button><button type="button" data-theme-choice="dark" data-t="dark"></button>
      </div>
      <button type="button" class="icon" id="help-open" aria-label="Help">?</button>
    </div>
  </div>
</header>
<div class="cols">
  <aside class="side"><nav class="toc" id="toc" aria-label="Contents"></nav></aside>
  <article id="doc"></article>
</div>

<dialog id="help">
  <div class="dialog-head"><h2 data-t="helpTitle"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body"><p data-t="helpBody"></p></div>
</dialog>
<dialog id="zoom">
  <div class="dialog-head"><h2 id="zoom-title"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body" id="zoom-body"></div>
</dialog>

<script>
// One dictionary for every UI string. The explanation itself is in DATA.
const TEXT = {
  en: {
    light: "Light", dark: "Dark", updated: "Updated", reading: "Reading time", owner: "Kept by",
    helpTitle: "How to read this page",
    helpBody: "The first section shows every part at once. Each later section explains one part in the order of the flow. Underlined terms open their meaning in the glossary at the end.",
  },
  ja: {
    light: "明るい", dark: "暗い", updated: "直した日", reading: "読む時間", owner: "持ち主",
    helpTitle: "この頁の読み方",
    helpBody: "最初の節で全ての部品を一度に見せます。後の節は流れの順に部品を1つずつ説明します。下線の付いた用語を押すと、最後の用語集で意味を開きます。",
  },
};

// The explanation. A following skill writes this object. Text may hold links to the glossary as
// [[term-id|shown words]].
const DATA = {
  title: { en: "How a report page is made", ja: "レポートの頁ができるまで" },
  lead: { en: "A skill measures the repository, writes the numbers into the report page, and checks the page before you open it.", ja: "スキルがリポジトリを測り、数をレポートの頁に書き、開く前に頁を確かめます。" },
  facts: [["updated", "2026-11-20"], ["reading", { en: "4 minutes", ja: "4分" }], ["owner", "design-formats"]],
  sections: [
    { id: "whole", title: { en: "The whole picture", ja: "全体の流れ" }, blocks: [
      { figure: "flow", caption: { en: "From the repository to the page you open. Press the figure to enlarge it.", ja: "リポジトリから開く頁までの流れ。図を押すと大きく開きます。" } },
      { p: { en: "The skill reads the [[git|git history]] and the files, scores each file, and fills the [[template|template]]. [[verify|verify]] checks the page before it is shown.", ja: "スキルが[[git|gitの履歴]]とファイルを読み、ファイルごとに点数を付けて[[template|雛形]]を埋めます。見せる前に[[verify|verify]]が頁を確かめます。" } },
    ] },
    { id: "measure", title: { en: "Measuring the repository", ja: "リポジトリを測る" }, blocks: [
      { p: { en: "Each file gets a score from how often it changed in the last 12 months, its size, and its long functions. Nothing is downloaded and nothing leaves the machine.", ja: "直近12か月に変わった回数、大きさ、長い関数から、ファイルごとに点数を付けます。何も取りに行かず、何もこのPCの外へ出しません。" } },
    ] },
    { id: "steps", title: { en: "Making the page", ja: "頁を作る" }, blocks: [
      { steps: [
        { text: { en: "Run the skill in the repository.", ja: "リポジトリでスキルを実行します。" }, output: "techdebt: scanned 26 files and 199 commits" },
        { text: { en: "Open the page it names.", ja: "スキルが名指した頁を開きます。" }, output: "report: ~/.local/share/techdebt/shop/report.html" },
        { text: { en: "Press a row to read its details beside the list.", ja: "行を押すと、一覧の横に詳細が出ます。" } },
      ] },
    ] },
    { id: "glossary", title: { en: "Glossary", ja: "用語集" }, blocks: [
      { glossary: [
        { id: "git", term: { en: "Git history", ja: "gitの履歴" }, meaning: { en: "The record of every commit, used here to count how often each file changed.", ja: "全てのコミットの記録。ここではファイルごとに変わった回数を数えるために使います。" } },
        { id: "template", term: { en: "Template", ja: "雛形" }, meaning: { en: "The HTML page with the frame and no numbers, which the skill fills in.", ja: "枠だけを持ち数を持たないHTMLの頁。スキルが中身を埋めます。" } },
        { id: "verify", term: { en: "verify", ja: "verify" }, meaning: { en: "The script that checks the page against the look rules and names each line to fix.", ja: "頁を見た目の決まりと照らし、直す行を名指すscript。" } },
      ] },
    ] },
  ],
};

const FIGURES = {
  flow: (labels) => {
    const boxes = labels.map((label, i) => {
      const x = 20 + i * 250;
      return `<rect x="${x}" y="30" width="200" height="104" rx="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
        <text x="${x + 100}" y="91" text-anchor="middle" font-size="26" font-weight="600" fill="var(--ink)">${label}</text>` +
        (i < labels.length - 1 ? `<path d="M${x + 204} 82 H${x + 244}" stroke="var(--sub)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>` : "");
    }).join("");
    return `<svg viewBox="0 0 990 164" role="img" aria-label="${labels.join(", ")}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/></marker></defs>${boxes}</svg>`;
  },
};
const FLOW = { en: ["Repository", "Skill", "Template", "verify"], ja: ["リポジトリ", "スキル", "雛形", "verify"] };

const state = { lang: "en" };
const $ = (id) => document.getElementById(id);
const t = (key) => TEXT[state.lang][key] ?? key;
const pick = (value) => (value && typeof value === "object" && !Array.isArray(value) ? value[state.lang] : value);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const linked = (s) => esc(s).replace(/\[\[([\w-]+)\|([^\]]+)\]\]/g, (_, id, words) => `<a href="#g-${id}">${words}</a>`);

function block(b) {
  if (b.p) return `<p>${linked(pick(b.p))}</p>`;
  if (b.figure) return `<figure data-figure="${b.figure}">${FIGURES[b.figure](FLOW[state.lang])}<figcaption>${esc(pick(b.caption))}</figcaption></figure>`;
  if (b.steps) return `<ol class="steps">${b.steps.map((s) => `<li><span>${linked(pick(s.text))}</span>${s.output ? `<pre>${esc(s.output)}</pre>` : ""}</li>`).join("")}</ol>`;
  if (b.glossary) return `<dl class="glossary">${b.glossary.map((g) => `<dt id="g-${g.id}">${esc(pick(g.term))}</dt><dd>${esc(pick(g.meaning))}</dd>`).join("")}</dl>`;
  return "";
}

function render() {
  document.documentElement.lang = state.lang;
  const title = pick(DATA.title);
  document.title = title;
  $("title").textContent = title;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("toc").innerHTML = DATA.sections.map((s, i) => `<a href="#${s.id}" aria-current="${i === 0}">${esc(pick(s.title))}</a>`).join("");
  $("doc").innerHTML = `<p class="lead">${esc(pick(DATA.lead))}</p>
    <dl class="facts">${DATA.facts.map(([k, v]) => `<div><dt>${esc(t(k))}</dt><dd>${esc(pick(v))}</dd></div>`).join("")}</dl>` +
    DATA.sections.map((s) => `<h2 id="${s.id}">${esc(pick(s.title))}</h2>${s.blocks.map(block).join("")}`).join("");
  watch();
}

let observer;
function watch() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      document.querySelectorAll("nav.toc a").forEach((a) => a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + entry.target.id)));
    });
  }, { rootMargin: "-70px 0px -70% 0px" });
  document.querySelectorAll("article h2").forEach((h) => observer.observe(h));
}

function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  document.querySelectorAll("[data-theme-choice]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === mode)));
  try { localStorage.setItem("page-design-theme", mode); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const lang = e.target.closest("[data-lang]");
  if (lang) { state.lang = lang.dataset.lang; try { localStorage.setItem("page-design-lang", state.lang); } catch (err) {} render(); return; }
  const theme = e.target.closest("[data-theme-choice]");
  if (theme) { setTheme(theme.dataset.themeChoice); return; }
  if (e.target.closest("#help-open")) { $("help").showModal(); return; }
  const figure = e.target.closest("[data-figure]");
  if (figure) {
    $("zoom-title").textContent = figure.querySelector("figcaption").textContent;
    $("zoom-body").innerHTML = FIGURES[figure.dataset.figure](FLOW[state.lang]);
    $("zoom").showModal();
    return;
  }
  if (e.target.closest("[data-close]")) e.target.closest("dialog").close();
});

try { state.lang = localStorage.getItem("page-design-lang") || "en"; } catch (e) {}
let startTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { startTheme = localStorage.getItem("page-design-theme") || startTheme; } catch (e) {}
setTheme(startTheme);
render();
</script>
</body>
</html>
