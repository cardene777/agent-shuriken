<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval sheet</title>
<!--
  page-design sheet: what will happen, the items to choose with the details of the pressed row
  beside them, and the text copied back to the chat. A following skill replaces DATA and the words
  in TEXT, and keeps copyText() free of the dictionary so the copied text never depends on the
  language of the page.
-->
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #1b2129; --sub: #4d5664; --line: #dce1e7;
  --accent: #2a5bd7; --accent-ink: #ffffff; --accent-soft: #e8eefc; --bar: #e9edf2; --warn: #8a5a00; --warn-soft: #fbf1dc; --label: #eef1f5;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --text-size: 15px; --line-height: 1.7; --page-width: 1200px; --radius-small: 8px; --radius: 10px; --radius-large: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
    --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --bar: #262c35; --warn: #f0b955; --warn-soft: #3a2e16; --label: #222831; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
  --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --bar: #262c35; --warn: #f0b955; --warn-soft: #3a2e16; --label: #222831; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--text-size)/var(--line-height) var(--sans); }
button, textarea { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: var(--page-width); margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 21px; line-height: 1.35; }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-small); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.icon { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; font-weight: 700; }

main { max-width: var(--page-width); margin: 0 auto; padding: 22px 24px 120px; display: grid; gap: 18px; }
.lead { margin: 0; max-width: 75ch; }
.facts-wrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
/* One row per fact: side by side as columns on wide screens, and label and value rows on phones */
.facts { width: 100%; border-collapse: collapse; }
.facts, .facts tbody { display: block; }
.facts tbody { display: grid; grid-auto-flow: column; grid-auto-columns: auto; }
.facts tr { display: grid; grid-template-rows: auto 1fr; border-left: 1px solid var(--line); }
.facts tr:first-child { border-left: 0; }
.facts th, .facts td { padding: 8px 18px; text-align: left; }
.facts th { font-size: 13px; font-weight: 500; color: var(--sub); background: var(--label); border-bottom: 1px solid var(--line); word-break: auto-phrase; }
.facts td { font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 860px) {
  .facts tbody { grid-auto-flow: row; }
  .facts tr { grid-template-columns: 9.5em minmax(0, 1fr); grid-template-rows: auto; border-left: 0; border-top: 1px solid var(--line); }
  .facts tr:first-child { border-top: 0; }
  .facts th, .facts td { padding: 9px 14px; }
  .facts th { border-bottom: 0; }
}

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--sub); white-space: nowrap; transition: color .15s, box-shadow .15s; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -3px 0 var(--accent); }
.tabs em { font-style: normal; font-size: 12px; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--bar); color: var(--sub); }

/* The list keeps a fixed width and the details take the rest; on a narrow screen the details replace the list */
.split { display: grid; grid-template-columns: minmax(320px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.list { min-width: 0; }
.back, .pick-toggle { display: none; justify-self: start; align-items: center; gap: 6px; }
.pick-toggle.primary { margin-left: 0; }
.step-nav { display: none; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.split.solo .step-nav { display: flex; }
.step-nav button { display: grid; gap: 2px; max-width: 48%; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.step-nav button[data-step="1"] { margin-left: auto; text-align: right; }
.step-nav small { font-size: 12px; color: var(--sub); }
.back { padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
.rows { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.row { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; transition: background-color .15s; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--bg); }
.row.open { box-shadow: inset 3px 0 0 var(--accent); }
.mark { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: transparent; transition: background-color .15s, border-color .15s; }
.row[aria-pressed="true"] { background: var(--accent-soft); }
.row[aria-pressed="true"] .mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.name { font-weight: 600; }
.row small { display: block; font-size: 13px; color: var(--sub); overflow-wrap: anywhere; }
.size { font-variant-numeric: tabular-nums; font-weight: 600; }

.detail { position: sticky; top: 84px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: grid; gap: 12px; animation: show .2s ease-out; }
.detail h2 { margin: 0; font-size: 18px; }
.kv { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: var(--radius-small); overflow: hidden; }
.kv th { width: 150px; padding: 8px 12px; text-align: left; vertical-align: top; font-weight: 500; color: var(--sub); background: var(--label); border-top: 1px solid var(--line); }
.kv td { padding: 8px 12px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.kv tr:first-child th, .kv tr:first-child td { border-top: 0; }
.caution { margin: 0; padding: 10px 14px; border-radius: var(--radius-small); background: var(--warn-soft); color: var(--warn); }
@keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); }
.dock-in { max-width: var(--page-width); margin: 0 auto; padding: 12px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.dock b { font-variant-numeric: tabular-nums; }
.primary { margin-left: auto; padding: 10px 20px; border: 0; border-radius: var(--radius-small); background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.primary:disabled { opacity: .45; cursor: default; }

dialog { width: min(720px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: var(--radius-large); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.dialog-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 17px; }
.dialog-head .icon { margin-left: auto; }
.dialog-body { padding: 16px 18px 20px; display: grid; gap: 12px; }
.dialog-body textarea { width: 100%; min-height: 140px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--bg); font: 14px/1.6 var(--mono); resize: vertical; }
.status { min-height: 1.6em; margin: 0; color: var(--ink); font-weight: 600; }
.dock .missing { color: var(--warn); font-weight: 600; }

@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .split:not(.solo) .detail, .split.solo .list { display: none; }
  .split.solo .back, .split.solo .pick-toggle { display: inline-flex; }
  .detail { position: static; }
  .top-in, main, .dock-in { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 id="title"></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button><button type="button" data-lang="ja">日本語</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" data-t="light"></button><button type="button" data-theme-choice="dark" data-t="dark"></button>
      </div>
      <button type="button" class="icon" id="help-open" aria-label="Help">?</button>
    </div>
  </div>
</header>

<main>
  <p class="lead" data-t="lead"></p>
  <div class="facts-wrap"><table class="facts" id="facts" role="table"></table></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="split" id="split">
    <div class="list"><div class="rows" id="rows"></div></div>
    <section class="detail" id="detail" aria-labelledby="detail-title" aria-live="polite"></section>
  </div>
</main>

<div class="dock">
  <div class="dock-in">
    <span id="picked"></span>
    <button type="button" class="primary" id="make" data-t="make"></button>
  </div>
</div>

<dialog id="help">
  <div class="dialog-head"><h2 data-t="helpTitle"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body"><p data-t="helpBody"></p></div>
</dialog>
<dialog id="copy">
  <div class="dialog-head"><h2 data-t="copyTitle"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body">
    <p data-t="copyBody"></p>
    <textarea id="copy-text" readonly aria-label="Text to paste"></textarea>
    <p class="status" id="copy-status" role="status"></p>
  </div>
</dialog>

<script>
// One dictionary for every UI string. The items are in DATA.
const TEXT = {
  en: {
    title: "Pick items to take off the winter menu",
    lead: "Press the items to take off the menu. Nothing changes from this page; the text you paste back in the chat names the items, and the agent checks each one again before it updates the menu board and the order page.",
    light: "Light", dark: "Dark", prevItem: "Previous", nextItem: "Next", between: "Move between items", back: "Back to the list", pickThis: "Choose this", unpick: "Remove from the choice", pickFirst: "Choose at least one item first.",
    week: "Week", menu: "Items on the menu", review: "Items to review", generated: "Generated",
    bread: "Bread", sweets: "Sweets", drinks: "Drinks",
    picked: "{n} picked, {amount} of weekly sales", make: "Make the text",
    sold: "Sold a week", stock: "Stock left", after: "After taking it off", perWeek: "{n} sold a week", none: "Nothing picked yet",
    helpTitle: "What happens after you paste",
    helpBody: "The agent reads the names in the text, checks each item again, skips any item whose sales changed since this page was made, and takes the rest off the menu board and the order page. It reports what it took off and what it skipped.",
    copyTitle: "Paste this in the chat",
    copyBody: "The text is copied. Paste it in the chat to take the picked items off the menu.",
    copied: "Copied.",
    copyFailed: "Could not copy. The text is selected; press Command+C or Ctrl+C to copy it.",
  },
  ja: {
    title: "冬のメニューから外す商品を選ぶ",
    lead: "メニューから外す商品を押して選びます。この頁からは何も変えません。チャットに貼り返す文が商品を名指し、エージェントがメニュー表と注文の頁を直す前に、商品ごとに確かめ直します。",
    light: "明るい", dark: "暗い", prevItem: "前へ", nextItem: "次へ", between: "項目の間を移る", back: "一覧へ戻る", pickThis: "これを選ぶ", unpick: "選んだ物から外す", pickFirst: "先に1つ以上選んでください。",
    week: "週", menu: "メニューの商品", review: "見直す商品", generated: "作った日時",
    bread: "パン", sweets: "菓子パン", drinks: "飲み物",
    picked: "{n}件を選択、週の売り上げ{amount}", make: "貼り返す文を作る",
    sold: "週に売れた数", stock: "残りの材料", after: "外した後", perWeek: "週に{n}個", none: "まだ選んでいません",
    helpTitle: "貼り返した後に起きること",
    helpBody: "エージェントは文の名前を読み、商品ごとに確かめ直し、この頁を作った後に売れ方が変わった商品を飛ばして、残りをメニュー表と注文の頁から外します。外した商品と飛ばした商品を報告します。",
    copyTitle: "チャットに貼る文",
    copyBody: "文をコピーしました。チャットに貼ると、選んだ商品をメニューから外します。",
    copied: "コピーしました。",
    copyFailed: "コピーできませんでした。文を選んだので、Command+CかCtrl+Cでコピーしてください。",
  },
};

// The items. A following skill writes this object.
const DATA = {
  skill: "winter-menu",
  facts: [["week", { en: "Nov 10 to 16", ja: "11月10日から16日" }], ["menu", "24"], ["review", "5"], ["generated", "2026-11-17 08:00"]],
  tabs: ["bread", "sweets", "drinks"],
  items: [
    { id: "pumpkin-bun", tab: "bread", sold: 14, yen: 3640, name: { en: "Pumpkin bun", ja: "かぼちゃのパン" },
      stock: { en: "Pumpkin paste for 5 days", ja: "かぼちゃの餡が5日分" }, after: { en: "Can come back in autumn with the same recipe", ja: "秋に同じ作り方で戻せる" } },
    { id: "raisin-loaf", tab: "bread", sold: 11, yen: 4620, name: { en: "Raisin loaf", ja: "レーズンの食パン" },
      stock: { en: "Raisins for 3 weeks", ja: "レーズンが3週分" }, after: { en: "The raisins go into the scones instead", ja: "レーズンはスコーンに使う" } },
    { id: "matcha-roll", tab: "sweets", sold: 7, yen: 3150, name: { en: "Matcha roll cake", ja: "抹茶のロールケーキ" },
      stock: { en: "Matcha powder for a month", ja: "抹茶の粉が1か月分" }, after: { en: "Takes two days to bring back, since the sponge is baked the day before", ja: "生地を前の日に焼くので、戻すのに2日かかる" } },
    { id: "iced-lemon-tea", tab: "drinks", sold: 9, yen: 3420, name: { en: "Iced lemon tea", ja: "アイスレモンティー" },
      stock: { en: "Lemons for 2 days", ja: "レモンが2日分" }, after: { en: "The lemons go into the lemon tart", ja: "レモンはレモンタルトに使う" } },
    { id: "cold-brew", tab: "drinks", sold: 12, yen: 4800, name: { en: "Cold brew coffee", ja: "水出しのコーヒー" },
      stock: { en: "None left", ja: "残っていない" }, after: { en: "Gone until next summer; the bottles are put away", ja: "来年の夏まで出せない。瓶はしまう" }, caution: true },
  ],
};

const state = { lang: "en", tab: "bread", open: "pumpkin-bun", picked: new Set(), solo: false, missing: false };
const $ = (id) => document.getElementById(id);
const t = (key) => TEXT[state.lang][key] ?? key;
const pick = (value) => (value && typeof value === "object" && !Array.isArray(value) ? value[state.lang] : value);
// Japanese text starts a new line after each full stop that has more text after it. A full stop right
// before a closing bracket or quote ends a quoted sentence inside a longer one, so it stays.
const lines = (s) => esc(s).replace(/\u3002(?![\u300d\u300f\uff09)\u3011\u3009\u300b]|&quot;|$)/gu, "\u3002<br>");
const narrow = () => window.matchMedia("(max-width: 860px)").matches;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const yen = (n) => (state.lang === "ja" ? n.toLocaleString("en-US") + "\u5186" : "\u00a5" + n.toLocaleString("en-US"));

// The text pasted back in the chat. It uses only fixed English words and item ids, never TEXT,
// so a script reads it the same way whichever language the page shows.
function copyText() {
  const ids = DATA.items.filter((item) => state.picked.has(item.id)).map((item) => item.id);
  return [DATA.skill + " approve", ...ids].join("\n");
}

const inTab = () => DATA.items.filter((x) => x.tab === state.tab);
const keyOf = () => (state.open ? "#item-" + state.open : "");
function focusRow() { const row = document.querySelector(`[data-item="${state.open}"]`); if (row) row.focus(); }
function openFromHash() {
  const item = DATA.items.find((x) => "#item-" + x.id === location.hash);
  if (!item) return false;
  state.tab = item.tab;
  state.open = item.id;
  return true;
}
// The open item lives in the URL fragment, so a link opens it again. The single pane and the
// full-width view add a history entry, so the browser's Back returns to the list.
function remember(solo) {
  const hash = keyOf();
  if (!hash) return;
  if (solo) history.pushState({ solo: true }, "", hash); else history.replaceState({ solo: false }, "", hash);
}
function goBack() {
  if (history.state && history.state.solo) { history.back(); return; }
  state.solo = false;
  history.replaceState({ solo: false }, "", location.hash);
  render();
  focusRow();
}
window.addEventListener("popstate", (e) => {
  state.solo = Boolean(e.state && e.state.solo);
  openFromHash();
  render();
  if (state.solo) $("back").focus(); else focusRow();
});

function render() {
  document.documentElement.lang = state.lang;
  document.title = t("title");
  $("title").textContent = t("title");
  document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = lines(t(el.dataset.t)); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("facts").innerHTML = `<tbody role="rowgroup">${DATA.facts.map(([k, v]) => `<tr role="row"><th scope="row" role="rowheader">${lines(t(k))}</th><td role="cell">${lines(pick(v))}</td></tr>`).join("")}</tbody>`;
  $("tabs").innerHTML = DATA.tabs.map((k) => {
    const count = DATA.items.filter((item) => item.tab === k).length;
    return `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === state.tab}">${lines(t(k))}<em>${count}</em></button>`;
  }).join("");
  $("rows").innerHTML = DATA.items.filter((item) => item.tab === state.tab).map((item) =>
    `<button type="button" class="row${item.id === state.open ? " open" : ""}" data-item="${item.id}" aria-pressed="${state.picked.has(item.id)}"><span class="mark" aria-hidden="true">&#x2713;</span><span><span class="name">${lines(pick(item.name))}</span><small>${lines(t("perWeek").replace("{n}", item.sold))}</small></span><span class="size">${yen(item.yen)}</span></button>`
  ).join("");
  const item = DATA.items.find((x) => x.id === state.open);
  const list = inTab();
  const at = list.indexOf(item);
  $("detail").innerHTML = item ? `<button type="button" class="back" id="back">&#x2190; ${lines(t("back"))}</button><h2 id="detail-title" tabindex="-1">${lines(pick(item.name))}</h2><button type="button" class="primary pick-toggle" data-toggle="${item.id}" aria-pressed="${state.picked.has(item.id)}">${lines(t(state.picked.has(item.id) ? "unpick" : "pickThis"))}</button><table class="kv"><tr><th>${lines(t("sold"))}</th><td>${item.sold}</td></tr><tr><th>${lines(t("stock"))}</th><td>${lines(pick(item.stock))}</td></tr><tr><th>${lines(t("after"))}</th><td>${lines(pick(item.after))}</td></tr></table>${item.caution ? `<p class="caution">${lines(pick(item.after))}</p>` : ""}<nav class="step-nav" aria-label="${esc(t("between"))}">${list[at - 1] ? `<button type="button" data-step="-1"><small>${lines(t("prevItem"))}</small>${lines(pick(list[at - 1].name))}</button>` : ""}${list[at + 1] ? `<button type="button" data-step="1"><small>${lines(t("nextItem"))}</small>${lines(pick(list[at + 1].name))}</button>` : ""}</nav>` : "";
  const chosen = DATA.items.filter((x) => state.picked.has(x.id));
  $("picked").innerHTML = chosen.length ? lines(t("picked")).replace("{n}", `<b>${chosen.length}</b>`).replace("{amount}", `<b>${yen(chosen.reduce((a, x) => a + x.yen, 0))}</b>`) : lines(t("none"));
  // The button stays pressable, and pressing it with nothing chosen says what is missing.
  if (state.missing && !chosen.length) $("picked").innerHTML = `<span class="missing">${lines(t("pickFirst"))}</span>`;
  $("split").classList.toggle("solo", state.solo);
}

function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  document.querySelectorAll("[data-theme-choice]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === mode)));
  try { localStorage.setItem("page-design-theme", mode); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const lang = e.target.closest("[data-lang]");
  if (lang) { state.lang = lang.dataset.lang; try { localStorage.setItem("page-design-lang", state.lang); } catch (err) {} render(); return; }
  const theme = e.target.closest("[data-theme-choice]");
  if (theme) { setTheme(theme.dataset.themeChoice); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; const first = DATA.items.find((x) => x.tab === state.tab); state.open = first ? first.id : ""; state.solo = false; render(); return; }
  const toggle = e.target.closest("[data-toggle]");
  if (toggle) {
    const id = toggle.dataset.toggle;
    if (state.picked.has(id)) state.picked.delete(id); else state.picked.add(id);
    state.missing = false;
    render();
    return;
  }
  if (e.target.closest("#back")) { goBack(); return; }
  const step = e.target.closest("[data-step]");
  if (step) {
    const list = inTab();
    const next = list[list.findIndex((x) => x.id === state.open) + Number(step.dataset.step)];
    if (next) state.open = next.id;
    history.replaceState({ solo: true }, "", keyOf());
    render();
    $("detail-title").focus();
    return;
  }
  const row = e.target.closest("[data-item]");
  if (row) {
    const id = row.dataset.item;
    state.open = id;
    // On a narrow screen a row opens its details in place of the list, where the item is chosen.
    if (narrow()) { state.solo = true; render(); remember(true); $("back").focus(); return; }
    if (state.picked.has(id)) state.picked.delete(id); else state.picked.add(id);
    state.missing = false;
    render();
    remember(false);
    return;
  }
  if (e.target.closest("#help-open")) { $("help").showModal(); return; }
  if (e.target.closest("#make")) {
    if (!state.picked.size) { state.missing = true; render(); return; }
    const box = $("copy-text");
    box.value = copyText();
    $("copy-status").textContent = "";
    $("copy").showModal();
    navigator.clipboard.writeText(box.value)
      .then(() => { $("copy-status").textContent = t("copied"); })
      .catch(() => { box.focus(); box.select(); $("copy-status").textContent = t("copyFailed"); });
    return;
  }
  if (e.target.closest("[data-close]")) e.target.closest("dialog").close();
});

try { state.lang = localStorage.getItem("page-design-lang") || "en"; } catch (e) {}
let startTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { startTheme = localStorage.getItem("page-design-theme") || startTheme; } catch (e) {}
setTheme(startTheme);
// A link to an item opens it, in the single pane on a narrow screen, and scrolls to it.
const fromLink = openFromHash();
if (fromLink) state.solo = narrow();
render();
if (fromLink) $("detail").scrollIntoView({ block: "start" });
</script>
</body>
</html>
