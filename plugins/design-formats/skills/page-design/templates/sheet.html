<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval sheet</title>
<!--
  page-design sheet: what will happen, the items to choose with the details of the pressed row
  beside them, and the text copied back to the chat. A following skill replaces DATA and the words
  in TEXT, and keeps copyText() free of the dictionary so the copied text never depends on the
  language of the page.
-->
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #1b2129; --sub: #4d5664; --line: #dce1e7;
  --accent: #2a5bd7; --accent-ink: #ffffff; --accent-soft: #e8eefc; --bar: #e9edf2; --warn: #8a5a00; --warn-soft: #fbf1dc;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
    --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --bar: #262c35; --warn: #f0b955; --warn-soft: #3a2e16; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
  --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --bar: #262c35; --warn: #f0b955; --warn-soft: #3a2e16; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--sans); }
button, textarea { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 21px; line-height: 1.35; }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.icon { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; font-weight: 700; }

main { max-width: 1200px; margin: 0 auto; padding: 22px 24px 120px; display: grid; gap: 18px; }
.lead { margin: 0; max-width: 75ch; }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.facts div { padding: 10px 16px; border-left: 1px solid var(--line); margin-left: -1px; }
.facts dt { font-size: 12.5px; color: var(--sub); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--sub); white-space: nowrap; transition: color .15s, box-shadow .15s; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -3px 0 var(--accent); }
.tabs em { font-style: normal; font-size: 12px; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--bar); color: var(--sub); }

.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.rows { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.row { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; transition: background-color .15s; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--bg); }
.row.open { box-shadow: inset 3px 0 0 var(--accent); }
.mark { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: transparent; transition: background-color .15s, border-color .15s; }
.row[aria-pressed="true"] { background: var(--accent-soft); }
.row[aria-pressed="true"] .mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.name { font-weight: 600; }
.row small { display: block; font-family: var(--mono); font-size: 13px; color: var(--sub); overflow-wrap: anywhere; }
.size { font-variant-numeric: tabular-nums; font-weight: 600; }

.detail { position: sticky; top: 84px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: grid; gap: 12px; animation: show .2s ease-out; }
.detail h2 { margin: 0; font-size: 18px; }
.kv { width: 100%; border-collapse: collapse; }
.kv th { width: 150px; padding: 8px 12px 8px 0; text-align: left; vertical-align: top; font-weight: 500; color: var(--sub); border-top: 1px solid var(--line); }
.kv td { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.caution { margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); }
@keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); }
.dock-in { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.dock b { font-variant-numeric: tabular-nums; }
.primary { margin-left: auto; padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.primary:disabled { opacity: .45; cursor: default; }

dialog { width: min(720px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.dialog-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 17px; }
.dialog-head .icon { margin-left: auto; }
.dialog-body { padding: 16px 18px 20px; display: grid; gap: 12px; }
.dialog-body textarea { width: 100%; min-height: 140px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: 14px/1.6 var(--mono); resize: vertical; }
.status { min-height: 1.6em; margin: 0; color: var(--accent); }

@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .detail { position: static; }
  .top-in, main, .dock-in { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 id="title"></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button><button type="button" data-lang="ja">日本語</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" data-t="light"></button><button type="button" data-theme-choice="dark" data-t="dark"></button>
      </div>
      <button type="button" class="icon" id="help-open" aria-label="Help">?</button>
    </div>
  </div>
</header>

<main>
  <p class="lead" data-t="lead"></p>
  <dl class="facts" id="facts"></dl>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="split">
    <div class="rows" id="rows"></div>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
</main>

<div class="dock">
  <div class="dock-in">
    <span id="picked"></span>
    <button type="button" class="primary" id="make" data-t="make"></button>
  </div>
</div>

<dialog id="help">
  <div class="dialog-head"><h2 data-t="helpTitle"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body"><p data-t="helpBody"></p></div>
</dialog>
<dialog id="copy">
  <div class="dialog-head"><h2 data-t="copyTitle"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body">
    <p data-t="copyBody"></p>
    <textarea id="copy-text" readonly aria-label="Text to paste"></textarea>
    <p class="status" id="copy-status" role="status"></p>
  </div>
</dialog>

<script>
// One dictionary for every UI string. The items are in DATA.
const TEXT = {
  en: {
    title: "Free up space on this Mac",
    lead: "Press the items to delete. Nothing is deleted from this page; the text you paste back in the chat names the items, and the agent checks each one again before deleting it.",
    light: "Light", dark: "Dark",
    scanned: "Scanned", free: "Free now", reclaim: "Can free", generated: "Generated",
    caches: "Caches", builds: "Old builds", logs: "Logs",
    picked: "{n} picked, {size} in total", make: "Make the text",
    path: "Location", made: "Made by", back: "Comes back", none: "Nothing picked yet",
    helpTitle: "What happens after you paste",
    helpBody: "The agent reads the names in the text, checks each item again, skips any item that changed since this page was made, and deletes the rest. It reports what it deleted and what it skipped.",
    copyTitle: "Paste this in the chat",
    copyBody: "The text is copied. Paste it in the chat to delete the picked items.",
    copied: "Copied.",
    copyFailed: "Could not copy. The text is selected; press Command+C or Ctrl+C to copy it.",
  },
  ja: {
    title: "このMacの空きを増やす",
    lead: "消す項目を押して選びます。この頁からは何も消しません。チャットに貼り返す文が項目を名指し、エージェントが消す前に項目ごとに確かめ直します。",
    light: "明るい", dark: "暗い",
    scanned: "調べた日時", free: "今の空き", reclaim: "空けられる量", generated: "作った日時",
    caches: "キャッシュ", builds: "古いビルド", logs: "ログ",
    picked: "{n}件を選択、合計{size}", make: "貼り返す文を作る",
    path: "場所", made: "作った物", back: "消した後", none: "まだ選んでいません",
    helpTitle: "貼り返した後に起きること",
    helpBody: "エージェントは文の名前を読み、項目ごとに確かめ直し、この頁を作った後に変わった項目を飛ばして、残りを消します。消した物と飛ばした物を報告します。",
    copyTitle: "チャットに貼る文",
    copyBody: "文をコピーしました。チャットに貼ると、選んだ項目を消します。",
    copied: "コピーしました。",
    copyFailed: "コピーできませんでした。文を選んだので、Command+CかCtrl+Cでコピーしてください。",
  },
};

// The items. A following skill writes this object.
const DATA = {
  skill: "machine-cleanup",
  facts: [["scanned", "2026-11-20 21:40"], ["free", "38.2 GB"], ["reclaim", "21.7 GB"], ["generated", "2026-11-20 21:42"]],
  tabs: ["caches", "builds", "logs"],
  items: [
    { id: "npm-cache", tab: "caches", bytes: 6.4e9, name: { en: "npm cache", ja: "npmのキャッシュ" }, path: "~/.npm/_cacache",
      made: { en: "npm, when it installs packages", ja: "npmがパッケージを入れる時" }, back: { en: "Downloaded again when a project installs", ja: "プロジェクトがインストールする時に取り直す" } },
    { id: "xcode-derived", tab: "builds", bytes: 9.1e9, name: { en: "Xcode build files", ja: "Xcodeのビルドの残り" }, path: "~/Library/Developer/Xcode/DerivedData",
      made: { en: "Xcode, when it builds an app", ja: "Xcodeがアプリをビルドする時" }, back: { en: "Rebuilt on the next build, which takes longer once", ja: "次のビルドで作り直す。その1回は時間がかかる" } },
    { id: "pip-cache", tab: "caches", bytes: 2.3e9, name: { en: "pip cache", ja: "pipのキャッシュ" }, path: "~/Library/Caches/pip",
      made: { en: "pip, when it installs packages", ja: "pipがパッケージを入れる時" }, back: { en: "Downloaded again when needed", ja: "要る時に取り直す" } },
    { id: "next-builds", tab: "builds", bytes: 2.6e9, name: { en: "Next.js build folders", ja: "Next.jsのビルドのフォルダ" }, path: "~/projects/*/.next",
      made: { en: "next build and next dev", ja: "next buildとnext dev" }, back: { en: "Rebuilt by the next build", ja: "次のビルドで作り直す" } },
    { id: "system-logs", tab: "logs", bytes: 1.3e9, name: { en: "Old app logs", ja: "古いアプリのログ" }, path: "~/Library/Logs",
      made: { en: "Apps on this Mac", ja: "このMacのアプリ" }, back: { en: "Gone for good; new logs start empty", ja: "元に戻らない。新しいログは空から始まる" }, caution: true },
  ],
};

const state = { lang: "en", tab: "caches", open: "npm-cache", picked: new Set() };
const $ = (id) => document.getElementById(id);
const t = (key) => TEXT[state.lang][key] ?? key;
const pick = (value) => (value && typeof value === "object" && !Array.isArray(value) ? value[state.lang] : value);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const size = (bytes) => (bytes / 1e9).toFixed(1) + " GB";

// The text pasted back in the chat. It uses only fixed English words and item ids, never TEXT,
// so a script reads it the same way whichever language the page shows.
function copyText() {
  const ids = DATA.items.filter((item) => state.picked.has(item.id)).map((item) => item.id);
  return [DATA.skill + " approve", ...ids].join("\n");
}

function render() {
  document.documentElement.lang = state.lang;
  document.title = t("title");
  $("title").textContent = t("title");
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("facts").innerHTML = DATA.facts.map(([k, v]) => `<div><dt>${esc(t(k))}</dt><dd>${esc(v)}</dd></div>`).join("");
  $("tabs").innerHTML = DATA.tabs.map((k) => {
    const count = DATA.items.filter((item) => item.tab === k).length;
    return `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === state.tab}">${esc(t(k))}<em>${count}</em></button>`;
  }).join("");
  $("rows").innerHTML = DATA.items.filter((item) => item.tab === state.tab).map((item) =>
    `<button type="button" class="row${item.id === state.open ? " open" : ""}" data-item="${item.id}" aria-pressed="${state.picked.has(item.id)}"><span class="mark" aria-hidden="true">&#x2713;</span><span><span class="name">${esc(pick(item.name))}</span><small>${esc(item.path)}</small></span><span class="size">${size(item.bytes)}</span></button>`
  ).join("");
  const item = DATA.items.find((x) => x.id === state.open);
  $("detail").innerHTML = item ? `<h2>${esc(pick(item.name))}</h2><table class="kv"><tr><th>${esc(t("path"))}</th><td>${esc(item.path)}</td></tr><tr><th>${esc(t("made"))}</th><td>${esc(pick(item.made))}</td></tr><tr><th>${esc(t("back"))}</th><td>${esc(pick(item.back))}</td></tr></table>${item.caution ? `<p class="caution">${esc(pick(item.back))}</p>` : ""}` : "";
  const chosen = DATA.items.filter((x) => state.picked.has(x.id));
  $("picked").innerHTML = chosen.length ? esc(t("picked")).replace("{n}", `<b>${chosen.length}</b>`).replace("{size}", `<b>${size(chosen.reduce((a, x) => a + x.bytes, 0))}</b>`) : esc(t("none"));
  $("make").disabled = chosen.length === 0;
}

function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  document.querySelectorAll("[data-theme-choice]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === mode)));
  try { localStorage.setItem("page-design-theme", mode); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const lang = e.target.closest("[data-lang]");
  if (lang) { state.lang = lang.dataset.lang; try { localStorage.setItem("page-design-lang", state.lang); } catch (err) {} render(); return; }
  const theme = e.target.closest("[data-theme-choice]");
  if (theme) { setTheme(theme.dataset.themeChoice); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; const first = DATA.items.find((x) => x.tab === state.tab); state.open = first ? first.id : ""; render(); return; }
  const row = e.target.closest("[data-item]");
  if (row) {
    const id = row.dataset.item;
    if (state.picked.has(id)) state.picked.delete(id); else state.picked.add(id);
    state.open = id;
    render();
    return;
  }
  if (e.target.closest("#help-open")) { $("help").showModal(); return; }
  if (e.target.closest("#make")) {
    const box = $("copy-text");
    box.value = copyText();
    $("copy-status").textContent = "";
    $("copy").showModal();
    navigator.clipboard.writeText(box.value)
      .then(() => { $("copy-status").textContent = t("copied"); })
      .catch(() => { box.focus(); box.select(); $("copy-status").textContent = t("copyFailed"); });
    return;
  }
  if (e.target.closest("[data-close]")) e.target.closest("dialog").close();
});

try { state.lang = localStorage.getItem("page-design-lang") || "en"; } catch (e) {}
let startTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { startTheme = localStorage.getItem("page-design-theme") || startTheme; } catch (e) {}
setTheme(startTheme);
render();
</script>
</body>
</html>
