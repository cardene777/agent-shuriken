<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report</title>
<!--
  page-design report: facts about the run, the result numbers, and a list with the details of the
  pressed row beside it. A following skill replaces DATA and the words in TEXT, and keeps the frame.
-->
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #1b2129; --sub: #4d5664; --line: #dce1e7;
  --accent: #2a5bd7; --accent-ink: #ffffff; --accent-soft: #e8eefc; --bar: #e9edf2;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
    --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --bar: #262c35; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
  --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --bar: #262c35; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--sans); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 21px; line-height: 1.35; }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.icon { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; font-weight: 700; }

main { max-width: 1200px; margin: 0 auto; padding: 22px 24px 48px; display: grid; gap: 18px; }
.lead { margin: 0; color: var(--sub); max-width: 75ch; }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.facts div { padding: 10px 16px; border-left: 1px solid var(--line); margin-left: -1px; }
.facts dt { font-size: 12.5px; color: var(--sub); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.stat b { display: block; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--sub); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--sub); white-space: nowrap; transition: color .15s, box-shadow .15s; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -3px 0 var(--accent); }
.tabs em { font-style: normal; font-size: 12px; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--bar); color: var(--sub); }

.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.list { display: grid; gap: 10px; min-width: 0; }
.rows { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.row { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) 96px; gap: 12px; align-items: center; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; transition: background-color .15s; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--bg); }
.row[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.rank { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.path { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.row small { display: block; font-family: var(--sans); font-size: 13px; color: var(--sub); }
.bar { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.pager { display: flex; justify-content: center; align-items: center; gap: 6px; }
.pager button { min-width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.pager button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.pager button:disabled { opacity: .45; cursor: default; }

.detail { position: sticky; top: 84px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: grid; gap: 12px; animation: show .2s ease-out; }
.detail-head { display: flex; gap: 12px; align-items: flex-start; }
.detail h2 { margin: 0; font: 600 17px/1.4 var(--mono); overflow-wrap: anywhere; }
.detail-head .icon { margin-left: auto; flex: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); font-size: 13px; }
.kv { width: 100%; border-collapse: collapse; }
.kv th { width: 132px; padding: 8px 12px 8px 0; text-align: left; vertical-align: top; font-weight: 500; color: var(--sub); border-top: 1px solid var(--line); }
.kv td { padding: 8px 0; border-top: 1px solid var(--line); }
@keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

dialog { width: min(720px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.dialog-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 17px; }
.dialog-head .icon { margin-left: auto; }
.dialog-body { padding: 16px 18px 20px; display: grid; gap: 12px; }

@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .detail { position: static; }
  .top-in, main { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 id="title"></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button><button type="button" data-lang="ja">日本語</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" data-t="light"></button><button type="button" data-theme-choice="dark" data-t="dark"></button>
      </div>
      <button type="button" class="icon" id="help-open" aria-label="Help">?</button>
    </div>
  </div>
</header>

<main>
  <p class="lead" data-t="lead"></p>
  <dl class="facts" id="facts"></dl>
  <div class="stats" id="stats"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="split">
    <div class="list">
      <nav class="pager" id="pager-top" aria-label="Pages"></nav>
      <div class="rows" id="rows"></div>
      <nav class="pager" id="pager-bottom" aria-label="Pages"></nav>
    </div>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
</main>

<dialog id="help">
  <div class="dialog-head"><h2 data-t="helpTitle"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body"><p data-t="helpBody"></p></div>
</dialog>
<dialog id="zoom">
  <div class="dialog-head"><h2 id="zoom-title"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body" id="zoom-body"></div>
</dialog>

<script>
// One dictionary for every UI string. The words of the report itself are in DATA.
const TEXT = {
  en: {
    title: "Technical debt in {repo}",
    lead: "Files ranked by how often they change, their size, long functions, markers, and missing tests. Fixing the top files pays off first.",
    light: "Light", dark: "Dark",
    commit: "Commit", branch: "Branch", files: "Source files", commits: "Commits in 12 months", generated: "Generated",
    ranked: "Files ranked", hotspots: "Hotspots", markers: "Markers", untested: "Untested files", long: "Long functions",
    start: "Start here",
    what: "What it is", why: "Why it costs", first: "First step",
    enlarge: "Enlarge", previous: "Previous page", next: "Next page",
    helpTitle: "How files are ranked",
    helpBody: "Each file gets a score from how often it changed in the last 12 months, its size, and its long functions. Markers and missing tests raise it. The bar shows the score against the top file.",
  },
  ja: {
    title: "{repo}の技術的負債",
    lead: "変わる回数、大きさ、長い関数、目印、テストの有無で並べたファイルです。上のファイルから直すと効果が早く出ます。",
    light: "明るい", dark: "暗い",
    commit: "コミット", branch: "ブランチ", files: "ソースファイル", commits: "直近12か月のコミット", generated: "作った日時",
    ranked: "順位を付けたファイル", hotspots: "よく変わるファイル", markers: "目印", untested: "テストの無いファイル", long: "長い関数",
    start: "最初に見る",
    what: "何か", why: "困る理由", first: "最初の一手",
    enlarge: "大きく見る", previous: "前の頁", next: "次の頁",
    helpTitle: "ファイルの順位の付け方",
    helpBody: "直近12か月に変わった回数、大きさ、長い関数から点数を付けます。目印とテストが無いことで点数が上がります。棒は一番上のファイルに対する点数を表します。",
  },
};

// The report. A following skill writes this object; every value shown to people is here.
const DATA = {
  repo: "shop",
  facts: [["commit", "61d7f14"], ["branch", "main"], ["files", "26"], ["commits", "199"], ["generated", "2026-11-13 21:05"]],
  stats: [["ranked", 20], ["hotspots", 19], ["markers", 6], ["untested", 15], ["long", 7]],
  tabs: ["start", "hotspots", "markers", "untested", "long"],
  items: [
    { path: "src/billing/invoice.py", score: 97, tabs: ["start", "hotspots", "untested"],
      tags: { en: ["changed 31 times", "543 lines", "no test file"], ja: ["31回変更", "543行", "テスト無し"] },
      what: { en: "Builds invoices, computes their totals, and renders the PDF", ja: "請求書を作り、合計を計算し、PDFに書き出す" },
      why: { en: "It changed 31 times this year with no test to catch a wrong total", ja: "今年31回変わり、合計の誤りを捕まえるテストが無い" },
      first: { en: "Add a test for invoice_total, then move render_pdf into its own module", ja: "invoice_totalのテストを足し、render_pdfを別のモジュールに移す" } },
    { path: "src/api/orders.ts", score: 67, tabs: ["start", "hotspots"],
      tags: { en: ["changed 44 times", "331 lines", "9 duplicated lines"], ja: ["44回変更", "331行", "重複9行"] },
      what: { en: "The HTTP handlers that create and update orders", ja: "注文を作って更新するHTTPの処理" },
      why: { en: "The most changed file, and its orderTotal is copied in returns.ts", ja: "一番よく変わり、orderTotalがreturns.tsに写されている" },
      first: { en: "Move orderTotal into src/lib/money.ts and call it from both handlers", ja: "orderTotalをsrc/lib/money.tsへ移し、両方の処理から呼ぶ" } },
    { path: "src/web/checkout.tsx", score: 52, tabs: ["start", "long"],
      tags: { en: ["changed 18 times", "402 lines", "2 long functions"], ja: ["18回変更", "402行", "長い関数2つ"] },
      what: { en: "The checkout page", ja: "購入の画面" },
      why: { en: "Two handlers of about 80 lines hold the payment and the address form", ja: "約80行の処理2つが支払いと住所のフォームを持つ" },
      first: { en: "Split the payment form into its own component", ja: "支払いのフォームを別の部品に分ける" } },
    { path: "src/lib/tax.py", score: 41, tabs: ["hotspots", "markers"],
      tags: { en: ["changed 12 times", "3 TODO markers"], ja: ["12回変更", "TODOの目印3つ"] },
      what: { en: "Tax rates by region", ja: "地域ごとの税率" },
      why: { en: "Three TODO markers point at rates that are hard-coded", ja: "TODOの目印3つが、決め打ちの税率を指している" },
      first: { en: "Read the rates from config/tax.json", ja: "税率をconfig/tax.jsonから読む" } },
    { path: "src/jobs/sync.ts", score: 33, tabs: ["untested", "long"],
      tags: { en: ["no test file", "1 long function"], ja: ["テスト無し", "長い関数1つ"] },
      what: { en: "The nightly job that copies orders to the warehouse", ja: "注文を倉庫へ写す夜間の処理" },
      why: { en: "A 120-line function retries without a limit", ja: "120行の関数が回数の上限なしに再試行する" },
      first: { en: "Add a test for the retry, then cap it at five tries", ja: "再試行のテストを足し、5回で止める" } },
    { path: "src/web/cart.tsx", score: 24, tabs: ["markers"],
      tags: { en: ["2 FIXME markers"], ja: ["FIXMEの目印2つ"] },
      what: { en: "The cart drawer", ja: "カートの引き出し" },
      why: { en: "Two FIXME markers note a rounding error in the subtotal", ja: "FIXMEの目印2つが、小計の端数の誤りを記している" },
      first: { en: "Use the money helpers from src/lib/money.ts", ja: "src/lib/money.tsの金額の処理を使う" } },
  ],
};

const PAGE_SIZE = 50;
const state = { lang: "en", tab: "start", page: 1, pick: 0 };
const $ = (id) => document.getElementById(id);
const t = (key) => TEXT[state.lang][key] ?? key;
const pick = (value) => (value && typeof value === "object" && !Array.isArray(value) ? value[state.lang] : value);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function shown() { return DATA.items.filter((item) => item.tabs.includes(state.tab)); }

function render() {
  document.documentElement.lang = state.lang;
  const title = t("title").replace("{repo}", DATA.repo);
  document.title = title;
  $("title").textContent = title;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("facts").innerHTML = DATA.facts.map(([k, v]) => `<div><dt>${esc(t(k))}</dt><dd>${esc(v)}</dd></div>`).join("");
  $("stats").innerHTML = DATA.stats.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${esc(t(k))}</span></div>`).join("");
  $("tabs").innerHTML = DATA.tabs.map((k) => {
    const count = DATA.items.filter((item) => item.tabs.includes(k)).length;
    return `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === state.tab}">${esc(t(k))}<em>${count}</em></button>`;
  }).join("");
  const items = shown();
  const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  state.page = Math.min(state.page, pages);
  const from = (state.page - 1) * PAGE_SIZE;
  const top = items[0] ? items[0].score : 1;
  $("rows").innerHTML = items.slice(from, from + PAGE_SIZE).map((item, i) => {
    const n = from + i;
    return `<button type="button" class="row" data-pick="${n}" aria-pressed="${n === state.pick}"><span class="rank">${n + 1}</span><span class="path">${esc(item.path)}<small>${esc(pick(item.what))}</small></span><span class="bar"><span style="width:${Math.round(item.score / top * 100)}%"></span></span></button>`;
  }).join("");
  ["pager-top", "pager-bottom"].forEach((id) => { $(id).innerHTML = pager(pages); });
  renderDetail(items[state.pick]);
}

function pager(pages) {
  const buttons = [`<button type="button" data-page="${state.page - 1}" aria-label="${esc(t("previous"))}" ${state.page === 1 ? "disabled" : ""}>&#x2039;</button>`];
  for (let p = 1; p <= pages; p++) buttons.push(`<button type="button" data-page="${p}" ${p === state.page ? 'aria-current="page"' : ""}>${p}</button>`);
  buttons.push(`<button type="button" data-page="${state.page + 1}" aria-label="${esc(t("next"))}" ${state.page === pages ? "disabled" : ""}>&#x203A;</button>`);
  return buttons.join("");
}

function detailBody(item) {
  return `<div class="tags">${pick(item.tags).map((g) => `<span>${esc(g)}</span>`).join("")}</div>
    <table class="kv"><tr><th>${esc(t("what"))}</th><td>${esc(pick(item.what))}</td></tr><tr><th>${esc(t("why"))}</th><td>${esc(pick(item.why))}</td></tr><tr><th>${esc(t("first"))}</th><td>${esc(pick(item.first))}</td></tr></table>`;
}

function renderDetail(item) {
  if (!item) { $("detail").innerHTML = ""; return; }
  $("detail").innerHTML = `<div class="detail-head"><h2>${esc(item.path)}</h2><button type="button" class="icon" id="zoom-open" aria-label="${esc(t("enlarge"))}">&#x2922;</button></div>${detailBody(item)}`;
}

function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  document.querySelectorAll("[data-theme-choice]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === mode)));
  try { localStorage.setItem("page-design-theme", mode); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const lang = e.target.closest("[data-lang]");
  if (lang) { state.lang = lang.dataset.lang; try { localStorage.setItem("page-design-lang", state.lang); } catch (err) {} render(); return; }
  const theme = e.target.closest("[data-theme-choice]");
  if (theme) { setTheme(theme.dataset.themeChoice); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; state.page = 1; state.pick = 0; render(); return; }
  const row = e.target.closest("[data-pick]");
  if (row) { state.pick = Number(row.dataset.pick); render(); return; }
  const page = e.target.closest("[data-page]");
  if (page && !page.disabled) { state.page = Number(page.dataset.page); state.pick = (state.page - 1) * PAGE_SIZE; render(); return; }
  if (e.target.closest("#help-open")) { $("help").showModal(); return; }
  if (e.target.closest("#zoom-open")) {
    const item = shown()[state.pick];
    $("zoom-title").textContent = item.path;
    $("zoom-body").innerHTML = detailBody(item);
    $("zoom").showModal();
    return;
  }
  if (e.target.closest("[data-close]")) e.target.closest("dialog").close();
});

try { state.lang = localStorage.getItem("page-design-lang") || "en"; } catch (e) {}
let startTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { startTheme = localStorage.getItem("page-design-theme") || startTheme; } catch (e) {}
setTheme(startTheme);
render();
</script>
</body>
</html>
