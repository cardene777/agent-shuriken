<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report</title>
<!--
  page-design report: facts about the period in a table, the result numbers on one band, figures, and a list of
  fixed width whose pressed row's details take the rest of the row
  with values the list does not show, and a list with each row's value and the details of the pressed
  row beside it. A following skill replaces DATA, the words in TEXT, and the notation in the figures,
  and keeps the frame. The figures are still dragon blocks; run dragon embed before handing the page over.
-->
<script type="module" src="https://cdn.jsdelivr.net/npm/@cardenelabs/dragon@0.80/dist/cdn/dragon.js"></script>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #1b2129; --sub: #4d5664; --line: #dce1e7;
  --accent: #2a5bd7; --accent-ink: #ffffff; --accent-soft: #e8eefc; --bar: #e9edf2; --label: #eef1f5;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
    --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --bar: #262c35; --label: #222831; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1a1e24; --ink: #e6e9ee; --sub: #a9b2be; --line: #2e343d;
  --accent: #7d9cff; --accent-ink: #0f1420; --accent-soft: #1f2a45; --bar: #262c35; --label: #222831; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--sans); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 21px; line-height: 1.35; }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: background-color .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.icon { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; font-weight: 700; }

main { max-width: 1200px; margin: 0 auto; padding: 22px 24px 48px; display: grid; gap: 18px; }
.lead { margin: 0; color: var(--sub); max-width: 75ch; }
.facts-wrap { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
/* One row per fact: side by side as columns on wide screens, and label and value rows on phones */
.facts { width: 100%; border-collapse: collapse; }
.facts, .facts tbody { display: block; }
.facts tbody { display: grid; grid-auto-flow: column; grid-auto-columns: auto; }
.facts tr { display: grid; grid-template-rows: auto 1fr; border-left: 1px solid var(--line); }
.facts tr:first-child { border-left: 0; }
.facts th, .facts td { padding: 8px 18px; text-align: left; }
.facts th { font-size: 13px; font-weight: 500; color: var(--sub); background: var(--label); border-bottom: 1px solid var(--line); word-break: auto-phrase; }
.facts td { font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 860px) {
  .facts tbody { grid-auto-flow: row; }
  .facts tr { grid-template-columns: 9.5em minmax(0, 1fr); grid-template-rows: auto; border-left: 0; border-top: 1px solid var(--line); }
  .facts tr:first-child { border-top: 0; }
  .facts th, .facts td { padding: 9px 14px; }
  .facts th { border-bottom: 0; }
}
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.stat { padding: 18px 22px; border-left: 1px solid var(--line); margin-left: -1px; }
.stat b { display: block; font-size: clamp(22px, 6.4vw, 30px); line-height: 1.25; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat span { display: block; font-size: 13.5px; color: var(--sub); }
.value { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 16px; }
.figure { display: flex; flex-direction: column; justify-content: center; margin: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: zoom-in; transition: border-color .15s; --dragon-figure-background: var(--surface); }
.figure.wide { grid-column: 1 / -1; }
.figure.wide [data-figure-lang] { width: 100%; max-width: 720px; margin: 0 auto; }
.figure:hover, .figure:focus-visible { border-color: var(--accent); outline: none; }
.figure svg, #zoom-body svg { display: block; width: 100%; height: auto; }
#zoom-body { --dragon-figure-background: var(--surface); }
.figure pre { margin: 0; white-space: pre-wrap; font: 13px/1.5 var(--mono); color: var(--sub); }
html[lang="en"] [data-figure-lang="ja"], html[lang="ja"] [data-figure-lang="en"] { display: none; }
dialog.wide { width: min(1080px, calc(100vw - 32px)); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--sub); white-space: nowrap; transition: color .15s, box-shadow .15s; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -3px 0 var(--accent); }
.tabs em { font-style: normal; font-size: 12px; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--bar); color: var(--sub); }

/* The list keeps a fixed width and the details take the rest; the full-width view hides the list until Back */
.split { display: grid; grid-template-columns: minmax(320px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.split.solo { grid-template-columns: minmax(0, 1fr); }
.split.solo .list, .split.solo #zoom-open { display: none; }
.back { display: none; justify-self: start; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
.split.solo .back { display: inline-flex; }
.step-nav { display: none; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.split.solo .step-nav { display: flex; }
.step-nav button { display: grid; gap: 2px; max-width: 48%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.step-nav button[data-step="1"] { margin-left: auto; text-align: right; }
.step-nav small { font-size: 12px; color: var(--sub); }
.list { display: grid; gap: 10px; min-width: 0; }
.rows { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.row { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; transition: background-color .15s; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--bg); }
.row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.rank { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.name { font-weight: 600; overflow-wrap: anywhere; word-break: auto-phrase; text-wrap: pretty; }
.row small { display: block; font-family: var(--sans); font-size: 13px; color: var(--sub); }
.pager { display: flex; justify-content: center; align-items: center; gap: 6px; }
.pager button { min-width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.pager button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.pager button:disabled { opacity: .45; cursor: default; }

.detail { position: sticky; top: 84px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: grid; gap: 12px; animation: show .2s ease-out; }
.detail-head { display: flex; gap: 12px; align-items: flex-start; }
.detail h2 { margin: 0; font-size: 18px; line-height: 1.4; overflow-wrap: anywhere; }
.detail-head .icon { margin-left: auto; flex: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); font-size: 13px; }
.kv { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kv th { width: 132px; padding: 8px 12px; text-align: left; vertical-align: top; font-weight: 500; color: var(--sub); background: var(--label); border-top: 1px solid var(--line); }
.kv td { padding: 8px 12px; border-top: 1px solid var(--line); }
.kv tr:first-child th, .kv tr:first-child td { border-top: 0; }
@keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

dialog { width: min(720px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.dialog-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 17px; }
.dialog-head .icon { margin-left: auto; }
.dialog-body { padding: 16px 18px 20px; display: grid; gap: 12px; }

@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .split:not(.solo) .detail { display: none; }
  .detail { position: static; }
  .stats { grid-template-columns: 1fr; }
  .stat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-left: 0; margin-left: 0; border-top: 1px solid var(--line); }
  .stat:first-child { border-top: 0; }
  .stat span { order: -1; }
  .top-in, main { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 id="title"></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button><button type="button" data-lang="ja">日本語</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" data-t="light"></button><button type="button" data-theme-choice="dark" data-t="dark"></button>
      </div>
      <button type="button" class="icon" id="help-open" aria-label="Help">?</button>
    </div>
  </div>
</header>

<main>
  <p class="lead" data-t="lead"></p>
  <div class="facts-wrap"><table class="facts" id="facts" role="table"></table></div>
  <div class="stats" id="stats"></div>
  <div class="figures">
    <figure class="figure wide" data-figure tabindex="0" role="button">
      <div data-figure-lang="en"><pre class="dragon" data-still>
chart Sales by day in thousand yen [shape: line]

item sales as Sales [color: blue]

step Tue
  say Tuesday brings 55.
  set sales: 55
step Wed
  say Wednesday brings 57.
  set sales: 57
step Thu
  say Thursday is the quietest day at 52.
  set sales: 52
step Fri
  say Friday brings 63.
  set sales: 63
step Sat
  say Saturday is the best day at 84.
  set sales: 84
step Sun
  say Sunday brings 79.
  set sales: 79
step Mon
  say Monday brings 60.
  set sales: 60
</pre></div>
      <div data-figure-lang="ja"><pre class="dragon" data-still>
chart 日ごとの売り上げ (千円) [shape: line]

item sales as 売り上げ [color: blue]

step 火
  say 火曜は55千円。
  set sales: 55
step 水
  say 水曜は57千円。
  set sales: 57
step 木
  say 木曜は週で一番少ない52千円。
  set sales: 52
step 金
  say 金曜は63千円。
  set sales: 63
step 土
  say 土曜は週で一番多い84千円。
  set sales: 84
step 日
  say 日曜は79千円。
  set sales: 79
step 月
  say 月曜は60千円。
  set sales: 60
</pre></div>
    </figure>
    <figure class="figure" data-figure tabindex="0" role="button">
      <div data-figure-lang="en"><pre class="dragon" data-still>
chart Sales by time of day in thousand yen [shape: bar]

item h7 as 7 to 9
item h9 as 9 to 11
item h11 as 11 to 13
item h13 as 13 to 15
item h15 as 15 to 17
item h17 as 17 to 19

step Week
  say Sales of the week by the hour of the day.
  set h7: 62
  set h9: 57
  set h11: 133
  set h13: 49
  set h15: 105
  set h17: 44
</pre></div>
      <div data-figure-lang="ja"><pre class="dragon" data-still>
chart 時間帯ごとの売り上げ (千円) [shape: bar]

item h7 as 7時から9時
item h9 as 9時から11時
item h11 as 11時から13時
item h13 as 13時から15時
item h15 as 15時から17時
item h17 as 17時から19時

step 今週
  say 1週間の売り上げを時間帯ごとに分けた。
  set h7: 62
  set h9: 57
  set h11: 133
  set h13: 49
  set h15: 105
  set h17: 44
</pre></div>
    </figure>
    <figure class="figure" data-figure tabindex="0" role="button">
      <div data-figure-lang="en"><pre class="dragon" data-still>
chart Share of sales [shape: donut]

item bread as Bread
item sweets as Sweets
item drinks as Drinks

step Week
  say Each kind of product as a share of the sales.
  set bread: 60
  set sweets: 27
  set drinks: 13
</pre></div>
      <div data-figure-lang="ja"><pre class="dragon" data-still>
chart 売り上げの割合 [shape: donut]

item bread as パン
item sweets as 菓子パン
item drinks as 飲み物

step 今週
  say 売り上げに占める種類ごとの割合。
  set bread: 60
  set sweets: 27
  set drinks: 13
</pre></div>
    </figure>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="split" id="split">
    <div class="list">
      <nav class="pager" id="pager-top" aria-label="Pages"></nav>
      <div class="rows" id="rows"></div>
      <nav class="pager" id="pager-bottom" aria-label="Pages"></nav>
    </div>
    <section class="detail" id="detail" aria-labelledby="detail-title" aria-live="polite"></section>
  </div>
</main>

<dialog id="help">
  <div class="dialog-head"><h2 data-t="helpTitle"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body"><p data-t="helpBody"></p></div>
</dialog>
<dialog id="zoom">
  <div class="dialog-head"><h2 id="zoom-title"></h2><button type="button" class="icon" data-close aria-label="Close">&#x2715;</button></div>
  <div class="dialog-body" id="zoom-body"></div>
</dialog>

<script>
// One dictionary for every UI string. The words of the report itself are in DATA.
const TEXT = {
  en: {
    lead: "Products ranked by sales this week. The details beside the list say why each one sold and what to try next week.",
    light: "Light", dark: "Dark", prevItem: "Previous", nextItem: "Next", between: "Move between items", back: "Back to the list", wide: "Show the details at full width",
    period: "Week", store: "Store", generated: "Generated",
    sales: "Sales", visits: "Customers", average: "Average spend", soldOut: "Sold out",
    all: "All", bread: "Bread", sweets: "Sweets", drinks: "Drinks",
    what: "What it is", why: "Why it sold", next: "Next week",
    enlarge: "Enlarge", previous: "Previous page", next_page: "Next page",
    helpTitle: "How products are ranked",
    helpBody: "Products are ranked by their sales in yen for the week. The two figures show the sales by the hour of the day and each kind's share of the sales. Press a figure to enlarge it.",
  },
  ja: {
    lead: "今週の売り上げの順に並べた商品です。一覧の横の詳細に、売れた理由と来週に試すことを書いています。",
    light: "明るい", dark: "暗い", prevItem: "前へ", nextItem: "次へ", between: "項目の間を移る", back: "一覧へ戻る", wide: "詳細を広く見る",
    period: "週", store: "店", generated: "作った日時",
    sales: "売り上げ", visits: "来た人", average: "1人あたり", soldOut: "売り切れた商品",
    all: "全て", bread: "パン", sweets: "菓子パン", drinks: "飲み物",
    what: "何か", why: "売れた理由", next: "来週に試すこと",
    enlarge: "大きく見る", previous: "前の頁", next_page: "次の頁",
    helpTitle: "商品の並べ方",
    helpBody: "その週の売り上げの金額で商品を並べます。2つの図は、時間帯ごとの売り上げと、種類ごとの売り上げの割合を表します。図を押すと大きく開きます。",
  },
};

// The report. A following skill writes this object; every value shown to people is here.
const DATA = {
  title: { en: "Weekly sales of the bakery", ja: "パン屋の週の売り上げ" },
  facts: [["period", { en: "Nov 10 to 16", ja: "11月10日から16日" }], ["store", { en: "Main street", ja: "本通り店" }], ["generated", "2026-11-17 08:00"]],
  stats: [["sales", { en: "¥449,860", ja: "449,860円" }], ["visits", "1,240"], ["average", { en: "¥363", ja: "363円" }], ["soldOut", "3"]],
  tabs: ["all", "bread", "sweets", "drinks"],
  items: [
    { name: { en: "Croissant", ja: "クロワッサン" }, score: 128520, tabs: ["all", "bread"],
      tags: { en: ["612 sold", "¥128,520", "sold out on 3 days"], ja: ["612個", "128,520円", "3日売り切れ"] },
      what: { en: "A butter croissant baked at 7 and at 11 in the morning", ja: "朝7時と11時に焼くバターのクロワッサン" },
      why: { en: "It sold out by noon on three days, and the 11 o'clock batch went fastest", ja: "3日は昼までに売り切れ、11時の焼き上がりが一番早く売れた" },
      next: { en: "Bake 40 more at 11 on weekdays", ja: "平日の11時の焼き上がりを40個増やす" } },
    { name: { en: "Melon bun", ja: "メロンパン" }, score: 81900, tabs: ["all", "sweets"],
      tags: { en: ["455 sold", "¥81,900"], ja: ["455個", "81,900円"] },
      what: { en: "A sweet bun with a crisp cookie crust", ja: "さくさくのクッキー生地をのせた甘いパン" },
      why: { en: "Families bought it most after school, from 3 to 5 in the afternoon", ja: "15時から17時に、学校帰りの家族が多く買った" },
      next: { en: "Put out a second tray at 3", ja: "15時に2回目の棚を出す" } },
    { name: { en: "White loaf", ja: "食パン" }, score: 73500, tabs: ["all", "bread"],
      tags: { en: ["210 sold", "¥73,500", "64 reserved"], ja: ["210本", "73,500円", "予約64本"] },
      what: { en: "A soft white loaf, sliced as the customer asks", ja: "注文に合わせて切る柔らかい食パン" },
      why: { en: "Customers reserved 64 loaves the day before", ja: "前の日に64本の予約があった" },
      next: { en: "Put the reservation sheet beside the register", ja: "予約の用紙をレジの横に置く" } },
    { name: { en: "Curry bun", ja: "カレーパン" }, score: 66440, tabs: ["all", "bread"],
      tags: { en: ["302 sold", "¥66,440"], ja: ["302個", "66,440円"] },
      what: { en: "A fried bun filled with beef curry", ja: "牛肉のカレーを包んで揚げたパン" },
      why: { en: "Sales rose on the two cold days", ja: "寒かった2日に売り上げが伸びた" },
      next: { en: "Fry more when the forecast is under 10 degrees", ja: "予報が10度を下回る日は多めに揚げる" } },
    { name: { en: "Hot coffee", ja: "ホットコーヒー" }, score: 58200, tabs: ["all", "drinks"],
      tags: { en: ["388 cups", "¥58,200"], ja: ["388杯", "58,200円"] },
      what: { en: "Drip coffee, brewed ten cups at a time", ja: "10杯ずつ淹れるドリップのコーヒー" },
      why: { en: "Seven in ten people who bought a croissant also bought a coffee", ja: "クロワッサンを買った人の10人に7人が一緒に買った" },
      next: { en: "Offer a croissant and coffee set", ja: "クロワッサンとコーヒーのセットを出す" } },
    { name: { en: "Strawberry tart", ja: "いちごのタルト" }, score: 41300, tabs: ["all", "sweets"],
      tags: { en: ["118 sold", "¥41,300", "new"], ja: ["118個", "41,300円", "新しい商品"] },
      what: { en: "A new tart topped with fresh strawberries", ja: "生のいちごをのせた新しいタルト" },
      why: { en: "It sold about the same every day from its first day, Thursday", ja: "木曜の初日から毎日同じくらい売れた" },
      next: { en: "Keep it on the shelf through December", ja: "12月まで棚に置き続ける" } },
  ],
};

const PAGE_SIZE = 50;
const state = { lang: "en", tab: "all", page: 1, pick: 0, solo: false };
const $ = (id) => document.getElementById(id);
const t = (key) => TEXT[state.lang][key] ?? key;
const pick = (value) => (value && typeof value === "object" && !Array.isArray(value) ? value[state.lang] : value);
// Japanese text starts a new line after each full stop that has more text after it. A full stop right
// before a closing bracket or quote ends a quoted sentence inside a longer one, so it stays.
const lines = (s) => esc(s).replace(/\u3002(?![\u300d\u300f\uff09)\u3011\u3009\u300b]|&quot;|$)/gu, "\u3002<br>");
const narrow = () => window.matchMedia("(max-width: 860px)").matches;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const yen = (n) => (state.lang === "ja" ? n.toLocaleString("en-US") + "\u5186" : "\u00a5" + n.toLocaleString("en-US"));

function shown() { return DATA.items.filter((item) => item.tabs.includes(state.tab)); }
const keyOf = () => (shown()[state.pick] ? "#item-" + DATA.items.indexOf(shown()[state.pick]) : "");
function focusRow() { const row = document.querySelector(`[data-pick="${state.pick}"]`); if (row) row.focus(); }
function openFromHash() {
  const item = DATA.items[Number((/^#item-(\d+)$/.exec(location.hash) || [])[1])];
  if (!item) return false;
  if (!item.tabs.includes(state.tab)) state.tab = "all";
  state.pick = shown().indexOf(item);
  state.page = Math.floor(state.pick / PAGE_SIZE) + 1;
  return true;
}
// The open item lives in the URL fragment, so a link opens it again. The single pane and the
// full-width view add a history entry, so the browser's Back returns to the list.
function remember(solo) {
  const hash = keyOf();
  if (!hash) return;
  if (solo) history.pushState({ solo: true }, "", hash); else history.replaceState({ solo: false }, "", hash);
}
function goBack() {
  if (history.state && history.state.solo) { history.back(); return; }
  state.solo = false;
  history.replaceState({ solo: false }, "", location.hash);
  render();
  focusRow();
}
window.addEventListener("popstate", (e) => {
  state.solo = Boolean(e.state && e.state.solo);
  openFromHash();
  render();
  if (state.solo) $("back").focus(); else focusRow();
});

function render() {
  document.documentElement.lang = state.lang;
  const title = pick(DATA.title);
  document.title = title;
  $("title").textContent = title;
  document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = lines(t(el.dataset.t)); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  document.querySelectorAll("[data-figure]").forEach((f) => f.setAttribute("aria-label", t("enlarge")));
  $("facts").innerHTML = `<tbody role="rowgroup">${DATA.facts.map(([k, v]) => `<tr role="row"><th scope="row" role="rowheader">${lines(t(k))}</th><td role="cell">${lines(pick(v))}</td></tr>`).join("")}</tbody>`;
  $("stats").innerHTML = DATA.stats.map(([k, v]) => `<div class="stat"><b>${lines(pick(v))}</b><span>${lines(t(k))}</span></div>`).join("");
  $("tabs").innerHTML = DATA.tabs.map((k) => {
    const count = DATA.items.filter((item) => item.tabs.includes(k)).length;
    return `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === state.tab}">${lines(t(k))}<em>${count}</em></button>`;
  }).join("");
  const items = shown();
  const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  state.page = Math.min(state.page, pages);
  const from = (state.page - 1) * PAGE_SIZE;
  $("rows").innerHTML = items.slice(from, from + PAGE_SIZE).map((item, i) => {
    const n = from + i;
    return `<button type="button" class="row" data-pick="${n}" aria-current="${n === state.pick}"><span class="rank">${n + 1}</span><span class="name">${lines(pick(item.name))}<small>${lines(pick(item.what))}</small></span><span class="value">${esc(yen(item.score))}</span></button>`;
  }).join("");
  // A list that fits on one page shows no pager.
  ["pager-top", "pager-bottom"].forEach((id) => { $(id).innerHTML = pages > 1 ? pager(pages) : ""; $(id).hidden = pages <= 1; });
  renderDetail(items[state.pick]);
  $("split").classList.toggle("solo", state.solo);
}

function pager(pages) {
  const buttons = [`<button type="button" data-page="${state.page - 1}" aria-label="${esc(t("previous"))}" ${state.page === 1 ? "disabled" : ""}>&#x2039;</button>`];
  for (let p = 1; p <= pages; p++) buttons.push(`<button type="button" data-page="${p}" ${p === state.page ? 'aria-current="page"' : ""}>${p}</button>`);
  buttons.push(`<button type="button" data-page="${state.page + 1}" aria-label="${esc(t("next_page"))}" ${state.page === pages ? "disabled" : ""}>&#x203A;</button>`);
  return buttons.join("");
}

function detailBody(item) {
  return `<div class="tags">${pick(item.tags).map((g) => `<span>${esc(g)}</span>`).join("")}</div>
    <table class="kv"><tr><th>${lines(t("what"))}</th><td>${lines(pick(item.what))}</td></tr><tr><th>${lines(t("why"))}</th><td>${lines(pick(item.why))}</td></tr><tr><th>${lines(t("next"))}</th><td>${lines(pick(item.next))}</td></tr></table>`;
}

function renderDetail(item) {
  if (!item) { $("detail").innerHTML = ""; return; }
  const list = shown();
  const at = list.indexOf(item);
  $("detail").innerHTML = `<button type="button" class="back" id="back">&#x2190; ${lines(t("back"))}</button><div class="detail-head"><h2 id="detail-title" tabindex="-1">${lines(pick(item.name))}</h2><button type="button" class="icon" id="zoom-open" aria-label="${esc(t("wide"))}">&#x2922;</button></div>${detailBody(item)}<nav class="step-nav" aria-label="${esc(t("between"))}">${list[at - 1] ? `<button type="button" data-step="-1"><small>${lines(t("prevItem"))}</small>${lines(pick(list[at - 1].name))}</button>` : ""}${list[at + 1] ? `<button type="button" data-step="1"><small>${lines(t("nextItem"))}</small>${lines(pick(list[at + 1].name))}</button>` : ""}</nav>`;
}

// A figure opens larger in the dialog. A chart shows its own title, so the dialog heading stays empty.
function openFigure(figure) {
  const shownFigure = figure.querySelector(`[data-figure-lang="${state.lang}"]`);
  $("zoom").classList.add("wide");
  $("zoom-title").textContent = "";
  $("zoom").setAttribute("aria-label", t("enlarge"));
  $("zoom-body").innerHTML = shownFigure ? shownFigure.innerHTML : "";
  $("zoom").showModal();
}

document.addEventListener("keydown", (e) => {
  const figure = e.target.closest && e.target.closest("[data-figure]");
  if (figure && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openFigure(figure); }
});

function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  document.querySelectorAll("[data-theme-choice]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === mode)));
  try { localStorage.setItem("page-design-theme", mode); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const lang = e.target.closest("[data-lang]");
  if (lang) { state.lang = lang.dataset.lang; try { localStorage.setItem("page-design-lang", state.lang); } catch (err) {} render(); return; }
  const theme = e.target.closest("[data-theme-choice]");
  if (theme) { setTheme(theme.dataset.themeChoice); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; state.page = 1; state.pick = 0; state.solo = false; render(); remember(false); return; }
  const step = e.target.closest("[data-step]");
  if (step) {
    state.pick = Math.min(Math.max(state.pick + Number(step.dataset.step), 0), shown().length - 1);
    state.page = Math.floor(state.pick / PAGE_SIZE) + 1;
    history.replaceState({ solo: true }, "", keyOf());
    render();
    $("detail-title").focus();
    return;
  }
  const row = e.target.closest("[data-pick]");
  // On a narrow screen the details replace the list, and Back returns to the pressed row.
  if (row) { state.pick = Number(row.dataset.pick); state.solo = narrow(); render(); remember(state.solo); if (state.solo) $("back").focus(); return; }
  if (e.target.closest("#back")) { goBack(); return; }
  const page = e.target.closest("[data-page]");
  if (page && !page.disabled) { state.page = Number(page.dataset.page); state.pick = (state.page - 1) * PAGE_SIZE; state.solo = false; render(); remember(false); return; }
  if (e.target.closest("#help-open")) { $("help").showModal(); return; }
  // Long details open in the full-width view, not in a dialog.
  if (e.target.closest("#zoom-open")) { state.solo = true; render(); remember(true); $("back").focus(); return; }
  const figure = e.target.closest("[data-figure]");
  if (figure) { openFigure(figure); return; }
  if (e.target.closest("[data-close]")) e.target.closest("dialog").close();
});

try { state.lang = localStorage.getItem("page-design-lang") || "en"; } catch (e) {}
let startTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { startTheme = localStorage.getItem("page-design-theme") || startTheme; } catch (e) {}
setTheme(startTheme);
// A link to an item opens it, in the single pane on a narrow screen, and scrolls to it.
const fromLink = openFromHash();
if (fromLink) state.solo = narrow();
render();
if (fromLink) $("detail").scrollIntoView({ block: "start" });
</script>
</body>
</html>
