[project]
name = "agent-shared"
version = "0.1.0"
description = "Deploy one folder of skills, rules, and hooks to Claude Code, Codex, and other coding agents"
license = {text = "MIT"}
authors = [{name = "cardene777"}]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-shared = "agent_shared.cli:main"

[project.urls]
Repository = "https://github.com/cardene777/agent-shuriken"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
agent_shared = ["agents.json"]
